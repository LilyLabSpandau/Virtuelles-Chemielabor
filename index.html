<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtuelles Chemielabor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chemielabor">
  <style>
    html, body { margin: 0; padding: 0; background: #000; font-family: sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

    /* Bühne mit festem Seitenverhältnis des Bildes, damit die Klickflächen auf jedem Gerät passen */
    .table-container {
      --w: min(100vw, calc(100vh * 1024 / 558));
      position: relative;
      width: var(--w);
      aspect-ratio: 1024 / 558;
      margin: 0 auto;
    }
    .table-container img { display: block; width: 100%; height: 100%; }

    .lab-link {
      position: absolute;
      display: block;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lab-link:hover, .lab-link:focus-visible {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    /* Klickflächen (Gegenstand samt Beschriftung im Bild) */
    .link-schultools { left: 32.5%; top: 16.8%; width: 35.8%; height: 16.5%; }  /* Lineal */
    .link-sek1       { left: 23.2%; top: 26.9%; width: 12.5%; height: 50.5%; }  /* Erlenmeyerkolben */
    .link-sek2       { left: 64.5%; top: 18.8%; width: 16.1%; height: 62.9%; }  /* Messkolben */

    .link-werkstatt  { left: 39.5%; top: 73.5%; width: 23%; height: 21%; }  /* Mörser mit Petrischalen */
    .werkstatt-label { position: absolute; left: 39.5%; width: 23%; top: 66%; text-align: center; pointer-events: none; font: 700 calc(var(--w) * 0.028) / 1 system-ui, -apple-system, sans-serif; color: #3a3a3a; }

  </style>
</head>
<body>

  <div class="table-container">
    <img src="lab-table.jpg" alt="Labortisch mit Gegenständen für Sekundarstufe I, Sekundarstufe II und Schultools">

    <!-- Das Lineal liegt zuerst, damit die Kolben bei Überschneidung Vorrang haben -->
    <a href="./Schultools/index.html" class="lab-link link-schultools" title="Schultools"></a>
    <a href="./Sekundarstufe-I/index.html" class="lab-link link-sek1" title="Sekundarstufe I"></a>
    <a href="./Sekundarstufe-II/index.html" class="lab-link link-sek2" title="Sekundarstufe II"></a>

    <a href="./Lewis-Werkstatt/index.html" class="lab-link link-werkstatt" title="Lewis-Werkstatt"></a>
    <span class="werkstatt-label">Lewis-Werkstatt</span>

    <a href="/Virtuelles-Chemielabor/impressum.html" style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 5px 10px; text-decoration: none; border-radius: 5px; font-family: sans-serif; font-size: 12px; z-index: 9999;">Impressum & Datenschutz</a>
  </div>

<script>if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
