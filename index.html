<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtuelles Chemielabor</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; font-family: sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

    /* Bühne mit festem Seitenverhältnis des Bildes, damit die Klickflächen auf jedem Gerät passen */
    .table-container {
      --w: min(100vw, calc(100vh * 1024 / 558));
      position: relative;
      width: var(--w);
      aspect-ratio: 1024 / 558;
      margin: 0 auto;
    }
    .table-container img { display: block; width: 100%; height: 100%; }

    .lab-link {
      position: absolute;
      display: block;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lab-link:hover, .lab-link:focus-visible {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    /* Klickflächen (Gegenstand samt Beschriftung im Bild) */
    .link-schultools { left: 32.5%; top: 16.8%; width: 35.8%; height: 16.5%; }  /* Lineal */
    .link-sek1       { left: 23.2%; top: 26.9%; width: 12.5%; height: 50.5%; }  /* Erlenmeyerkolben */
    .link-sek2       { left: 64.5%; top: 18.8%; width: 16.1%; height: 62.9%; }  /* Messkolben */

    /* Impressums-Link */
    .impressum-link {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 5px 10px;
      border-radius: 4px;
    }
    .impressum-link:hover { color: white; background: rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div class="table-container">
    <img src="lab-table.jpg" alt="Labortisch mit Gegenständen für Sekundarstufe I, Sekundarstufe II und Schultools">

    <!-- Das Lineal liegt zuerst, damit die Kolben bei Überschneidung Vorrang haben -->
    <a href="./Schultools/index.html" class="lab-link link-schultools" title="Schultools"></a>
    <a href="./Sekundarstufe-I/index.html" class="lab-link link-sek1" title="Sekundarstufe I"></a>
    <a href="./Sekundarstufe-II/index.html" class="lab-link link-sek2" title="Sekundarstufe II"></a>

    <a href="./impressum.html" class="impressum-link">Impressum & Datenschutz</a>
  </div>

</body>
</html>
