    html, body { margin: 0; padding: 0; background: #000; font-family: system-ui, sans-serif; }

    /* Bühne mit festem Seitenverhältnis des Bildes, damit die Klickflächen auf jedem Gerät passen */
    .stage {
      --w: min(100vw, calc(100vh * 2576 / 1438));
      position: relative;
      width: var(--w);
      aspect-ratio: 2576 / 1438;
      margin: 0 auto;
    }
    .stage img { display: block; width: 100%; height: 100%; }

    .item {
      position: absolute;
      display: block;
      border-radius: 14px;
      cursor: pointer;
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }
    .item:hover, .item:focus-visible {
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    /* Beschriftung: standardmäßig unter dem Gegenstand, mit "above" darüber */
    .label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: calc(var(--w) * 0.004);
      width: max-content;
      max-width: calc(var(--w) * 0.19);
      text-align: center;
      font-weight: 700;
      line-height: 1.15;
      color: #8b1a1a;
      font-size: max(10px, calc(var(--w) * 0.019));
    }
    .label.above {
      top: auto;
      bottom: 100%;
      margin-top: 0;
      margin-bottom: calc(var(--w) * 0.004);
    }

    /* Klickflächen der Gegenstände */
    .link-1 { left: 18.8%; top: 29.6%; width: 12.7%; height: 15.9%; }  /* Salz */

    .link-4 { left: 73.3%; top: 25.8%; width: 10.4%; height: 21.2%; }  /* Campinggas */
    .link-5 { left: 21.1%; top: 59.0%; width: 6.5%;  height: 23.3%; }  /* Apothekerflasche */
    .link-6 { left: 46.3%; top: 57.0%; width: 7.5%;  height: 26.2%; }  /* Essig */
    .link-7 { left: 68.7%; top: 62.9%; width: 9.5%;  height: 19.5%; }  /* Duftflakon */


    /* Arbeitentraining und Wiederholung (Klemmbrett) */
    .link-train { left: 31%; top: 50%; width: 9%; height: 17%; }
    .link-train svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 6px rgba(0,0,0,.28)); }
    .label.train { max-width: calc(var(--w) * 0.19); }

    .back-link {
      position: absolute;
      left: 50%;
      top: 1.2%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: white;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5em 0.9em;
      border-radius: 8px;
      font-weight: 700;
      font-size: max(11px, calc(var(--w) * 0.0105));
    }
    .back-link:hover { background: rgba(0, 0, 0, 0.8); }

    /* Hochkant-Bildschirme (Handy): Beschriftung etwas größer, damit sie lesbar bleibt */
    @media (max-aspect-ratio: 1/1) {
      .label { font-size: max(9.5px, calc(var(--w) * 0.027)); }
    }
  </style>
