<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1330">
<title>Alkene, Alkine und Cyclokohlenwasserstoffe – Überblick</title>
<style>
:root{
  --bg1:#0b1029; --bg2:#1a2150; --card:#18204a; --card2:#222c5e; --line:#3a4784; --txt:#e9edff; --mut:#aab3e0;
  --c1:#4cc9f0; --c2:#80ed99; --c3:#ffd166; --ok:#3ddc97; --bad:#ff6b6b; --paper:#f6f8ff; --ink:#1b2540;
  --acc:#ffb020; --acc2:#ffe08a;
  --acc:#ff9f43;--acc2:#ffd08a;--bg1:#0c1034;--bg2:#2a1f5c;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:var(--txt);background:radial-gradient(ellipse at top,var(--bg2) 0,var(--bg1) 75%) no-repeat,var(--bg1);min-height:100vh;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
.view{display:none}
.view.active{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 70px}
.btn{display:inline-block;font-weight:700;font-size:1rem;color:#10163a;background:linear-gradient(#ffe08a,var(--acc));border:none;border-radius:10px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);-webkit-appearance:none}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.grey{background:#2c376f;color:var(--txt);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn.small{padding:6px 14px;font-size:.92rem;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.45;cursor:default}
.topnav{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px;align-items:center}

/* Gate */
#v-gate{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
#v-gate.active{display:flex}
.gate{max-width:480px;width:100%;text-align:center;background:linear-gradient(160deg,var(--card2),var(--card));border:2px solid var(--acc);border-radius:18px;padding:34px 26px 26px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.gate .lockico{width:92px;height:92px;margin:-78px auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc) 60%,#6b4300);display:flex;align-items:center;justify-content:center;font-size:2.6rem;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.gate .no{color:var(--acc2);font-weight:700;letter-spacing:2px;font-size:.8rem;text-transform:uppercase}
.gate h1{margin:4px 0 6px;font-size:1.5rem;line-height:1.25}
.gate p{color:var(--mut);margin:6px 0}
.gate input{width:100%;font-size:1.25rem;text-align:center;padding:12px;border:2px solid var(--line);border-radius:10px;background:#0d1330;color:var(--txt);margin:14px 0 6px;letter-spacing:1px}
.gate input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
.gate .err{color:var(--bad);font-weight:700;min-height:1.5em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Home */
h1.title{text-align:center;color:var(--acc2);margin:10px 0 2px;font-size:2rem;line-height:1.2;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--acc);box-shadow:0 16px 44px rgba(0,0,0,.6);background:#111}
.scene svg{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;cursor:pointer;padding:0;color:#fff;-webkit-tap-highlight-color:transparent}
.hot .badge{position:relative;width:74px;height:74px;border-radius:50%;background:#10163a;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:2.1rem;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.55);transition:transform .15s}
.hot .mark{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#06241a;font-weight:800;font-size:1rem;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.hot.done .mark{display:flex}
.hot .lab{background:var(--c);color:#10163a;font-weight:800;font-size:1rem;padding:5px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.45);white-space:nowrap}
.hot:hover .badge,.hot:focus-visible .badge{transform:scale(1.1)}
.hot:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:12px}
.hot::before{content:"";position:absolute;top:0;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;border:3px solid var(--c);animation:puls 2.2s ease-out infinite;pointer-events:none}
@keyframes puls{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.hot::before{animation:none}.view.active{animation:none}}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.35);padding:18px 22px;margin:16px 0}
.card h2{margin:0 0 6px;color:var(--acc2);font-size:1.2rem}
.card ol{margin:6px 0 0;padding-left:22px}
.card li{margin:4px 0}
.footer-note{font-size:.85rem;color:var(--mut);text-align:center;margin:18px 0 6px}
.impressum-link{position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;text-decoration:none;z-index:99}
.pills{display:none;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{flex:1 1 30%;border:none;border-radius:999px;background:var(--c);color:#10163a;font-weight:800;padding:10px 8px;font-size:.95rem;cursor:pointer}

/* Abschnitt */
.sec-head{border-radius:14px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--c),#00000066 150%);color:#10163a;border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.sec-head .ico{font-size:2.6rem}
.sec-head h2{margin:0;font-size:1.6rem}
.sec-head p{margin:2px 0 0;font-weight:600;opacity:.85}
.blk{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:18px 22px;margin:14px 0}
.blk h3{margin:0 0 8px;font-size:1.15rem;color:var(--c)}
.blk h4{margin:14px 0 4px;color:var(--acc2)}
.blk p{margin:0 0 .75em}
.blk ul{margin:.3em 0 .8em;padding-left:22px}
.blk li{margin:3px 0}
.tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--c);color:#10163a;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.key{background:rgba(255,255,255,.07);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:8px 14px;margin:10px 0}
table.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tbl th{background:rgba(255,255,255,.08);color:var(--acc2)}
.note{background:#fff4c2;color:#3b3000;border:2px dashed #b08900;border-radius:12px;padding:12px 18px;margin:16px 0;box-shadow:0 6px 16px rgba(0,0,0,.35);position:relative}
.note b.nt{display:block;font-size:1rem;margin-bottom:4px}
.note ul{margin:4px 0 0;padding-left:20px}
.note li{margin:3px 0}
.mol{background:var(--paper);border-radius:10px;padding:8px;display:flex;justify-content:center;overflow-x:auto;margin:8px 0}
.mol svg{max-width:100%;height:auto}
.molrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.molrow .op{font-size:1.8rem;font-weight:800;color:var(--acc2)}
.molbox{background:var(--paper);border-radius:10px;padding:6px 10px;text-align:center;color:var(--ink)}
.molbox small{display:block;font-weight:700;color:#45508a;margin-top:-4px}
.fig{background:var(--paper);border-radius:10px;padding:8px;margin:10px 0;text-align:center;color:var(--ink)}
.fig svg{max-width:100%;height:auto}
.fig figcaption{font-size:.88rem;color:#45508a;margin-top:2px}

/* Widgets */
.opts,.chips{display:flex;gap:8px;flex-wrap:wrap}
.opt,.chip{font-size:.98rem;border:2px solid var(--line);background:#0f1638;color:var(--txt);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;-webkit-appearance:none}
.opt.sel,.chip.sel{background:var(--c);color:#10163a;border-color:var(--c);font-weight:700}
.opt.ok{background:#12452f;border-color:var(--ok)}
.opt.bad{background:#4a1d27;border-color:var(--bad);opacity:.8}
.qopts{display:grid;gap:8px;margin-top:8px}
.qopts .opt{width:100%}
.res{margin-top:10px;font-weight:700}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.why{margin-top:8px;padding:8px 14px;background:rgba(61,220,151,.12);border-left:4px solid var(--ok);border-radius:0 8px 8px 0}
.sortgrid{display:grid;gap:8px;margin-top:8px}
.sortrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0f1638;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.sortrow .t{flex:1 1 260px}
.sortrow.ok,.ordrow.ok{border-color:var(--ok);background:#0f3023}
.sortrow.bad,.ordrow.bad{border-color:var(--bad);background:#3a1620}
.ordrow{display:flex;gap:10px;align-items:center;background:#0f1638;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.ordrow .t{flex:1}
.ordrow button{border:1px solid var(--line);background:#2c376f;color:var(--txt);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1rem}
.ordnum{font-weight:800;color:var(--c);width:24px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mit{background:#0f1638;border:2px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--txt);text-align:left;font-size:.96rem}
.mit.sel{border-color:var(--acc);background:#2a2a10}
.mit.ok{border-color:var(--ok);background:#0f3023;cursor:default}
.mit.bad{border-color:var(--bad);background:#3a1620}
.chartwrap svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:10px}
.slid{width:100%;margin:10px 0 4px;accent-color:var(--acc);height:34px}
.read{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.read span{background:#0f1638;border:2px solid var(--line);border-radius:10px;padding:6px 12px}
.read b{color:var(--acc2)}
.lab-area{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.tubewrap{flex:0 0 150px;text-align:center}
.tubewrap.shake{animation:tubeshake .9s}
@keyframes tubeshake{10%{transform:rotate(-16deg)}30%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}70%{transform:rotate(10deg)}90%{transform:rotate(-4deg)}}
.lab-ctrl{flex:1 1 260px}
.liq{transition:fill 1.6s ease}
.mirror{transition:opacity 1.6s ease}
.obs{margin-top:10px;background:rgba(255,255,255,.07);border-left:4px solid var(--c);border-radius:0 8px 8px 0;padding:8px 14px;min-height:2.6em}
.bld{display:grid;gap:10px}
.bld .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bld .lbl{font-weight:700;color:var(--mut);min-width:110px}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp button{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#2c376f;color:var(--txt);font-size:1.3rem;cursor:pointer}
.stp output{min-width:34px;text-align:center;font-weight:800;font-size:1.2rem}
.out{background:#0f1638;border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.out .nm{font-size:1.5rem;font-weight:800;color:var(--acc2);line-height:1.25}
.out .fm{color:var(--mut);margin-top:4px}
.out .fm b{color:var(--txt)}
.cpos{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#2c376f;color:var(--txt);font-weight:700;cursor:pointer}
.cpos.sel{background:#d62839;border-color:#ff8f9c;color:#fff}
.goal{display:inline-block;margin:3px 6px 3px 0;padding:4px 12px;border-radius:999px;background:#0f1638;border:2px solid var(--line)}
.goal.ok{background:#12452f;border-color:var(--ok)}
.rx{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.rx.swap .L{display:none}.rx:not(.swap) .R{display:none}
.done-badge{display:inline-block;margin-left:8px;color:var(--ok);font-weight:800}

@media (max-width:760px){
  h1.title{font-size:1.5rem}
  .hot .badge{width:46px;height:46px;font-size:1.3rem;border-width:3px}
  .hot::before{width:46px;height:46px;margin-left:-23px}
  .hot .lab{font-size:.68rem;padding:3px 8px}
  .hot .mark{width:20px;height:20px;font-size:.7rem;right:-6px;top:-6px}
  .sec-head{flex-direction:column;text-align:center}
  .match{grid-template-columns:1fr}
  .pills{display:flex}
  .blk{padding:14px 14px}
}
</style>

<script>
const CFG={"id": "alkene", "no": 1, "icon": "🔥", "title": "Alkene, Alkine und Cyclokohlenwasserstoffe", "sections": {"eig": {"name": "Eigenschaften", "icon": "🔬", "x": 15, "y": 79, "lead": "Doppelbindung, Dreifachbindung, Ring: Was macht diese Stoffe besonders?", "blocks": [{"type": "text", "html": "<h3>Vier Stoffklassen im Überblick</h3>\n<p>Alle vier sind <b>Kohlenwasserstoffe</b>: Sie bestehen nur aus C- und H-Atomen. Sie unterscheiden sich in den Bindungen zwischen den C-Atomen.</p>\n<table class=\"tbl\"><tr><th>Stoffklasse</th><th>Merkmal</th><th>allgemeine Formel</th><th>Beispiel</th></tr>\n<tr><td>Alkane (Wiederholung)</td><td>nur Einfachbindungen, <b>gesättigt</b></td><td>CₙH₂ₙ₊₂</td><td>Ethan C₂H₆</td></tr>\n<tr><td>Alkene</td><td>mindestens eine <b>C=C-Doppelbindung</b>, <b>ungesättigt</b></td><td>CₙH₂ₙ</td><td>Ethen C₂H₄</td></tr>\n<tr><td>Alkine</td><td>mindestens eine <b>C≡C-Dreifachbindung</b>, <b>ungesättigt</b></td><td>CₙH₂ₙ₋₂</td><td>Ethin C₂H₂</td></tr>\n<tr><td>Cycloalkane</td><td>C-Atome im <b>Ring</b>, nur Einfachbindungen</td><td>CₙH₂ₙ</td><td>Cyclohexan C₆H₁₂</td></tr></table>\n<div class=\"key\"><b>Ungesättigt</b> heißt: Das Molekül hat weniger H-Atome, als bei dieser Zahl an C-Atomen möglich wären. Dafür hat es Mehrfachbindungen.</div>"}, {"type": "mols", "title": "So sehen sie aus", "intro": "Strukturformeln: Jeder Strich ist ein Elektronenpaar der Bindung.", "list": [["alkan", 2], ["en", 2], ["in", 2], ["cyc", 6, false]]}, {"type": "match", "title": "Name und Summenformel", "intro": "Tippe links einen Namen an und rechts die passende Summenformel.", "pairs": [["Ethen", "C₂H₄"], ["Ethin", "C₂H₂"], ["Propen", "C₃H₆"], ["But-1-in", "C₄H₆"], ["Cyclopentan", "C₅H₁₀"], ["Cyclohexan", "C₆H₁₂"]]}, {"type": "note", "title": "Auf dein Arbeitsblatt", "items": ["Die vier Stoffklassen mit Merkmal und allgemeiner Formel (kleine Tabelle)", "Eine Strukturformel als Beispiel (Ethen oder Ethin)", "Was bedeutet „gesättigt“ und „ungesättigt“?"]}, {"type": "text", "html": "<h3>Reaktionsfreudig: die Mehrfachbindung</h3>\n<p>Alkane reagieren nur widerwillig. Alkene und Alkine sind viel <b>reaktiver</b>: Die Mehrfachbindung kann „aufgehen“ und andere Atome aufnehmen. Das nennt man eine <b>Addition</b>. Ein Beispiel ist die Addition von Brom (Br₂) an eine Doppelbindung. Dabei verschwindet die orange Farbe des Broms.</p>\n<div class=\"key\">Mit <b>Bromwasser</b> kann man ungesättigte Stoffe nachweisen.</div>"}, {"type": "lab", "title": "Bromwasser-Test", "intro": "Teste alle Stoffe. Die Flüssigkeiten sind farblos.", "addLabel": "Bromwasser zugeben", "actLabel": "Schütteln", "reagentColor": "#f59e0b", "samples": [{"name": "Hexan", "sub": "C₆H₁₄", "c": "#e8f2ff", "end": [["#fde3a7", 0.4], ["#f59e0b", 0.3]], "obs": "Die orange Farbe bleibt. Das Bromwasser wird nicht entfärbt."}, {"name": "Hex-1-en", "sub": "C₆H₁₂", "c": "#e8f2ff", "end": [["#eef3ff", 0.4], ["#eef3ff", 0.3]], "obs": "Das Reagenzglas wird farblos. Das Bromwasser ist entfärbt."}, {"name": "Cyclohexan", "sub": "C₆H₁₂", "c": "#e8f2ff", "end": [["#fde3a7", 0.4], ["#f59e0b", 0.3]], "obs": "Die orange Farbe bleibt. Das Bromwasser wird nicht entfärbt."}, {"name": "Cyclohexen", "sub": "C₆H₁₀", "c": "#e8f2ff", "end": [["#eef3ff", 0.4], ["#eef3ff", 0.3]], "obs": "Das Reagenzglas wird farblos. Das Bromwasser ist entfärbt."}, {"name": "Hex-1-in", "sub": "C₆H₁₀", "c": "#e8f2ff", "end": [["#eef3ff", 0.4], ["#eef3ff", 0.3]], "obs": "Das Reagenzglas wird farblos. Das Bromwasser ist entfärbt."}]}, {"type": "quiz", "title": "Detektivarbeit", "qs": [{"q": "Zwei Flaschen ohne Etikett enthalten Hex-1-en und Cyclohexan. Beide haben die Formel C₆H₁₂. Wie findest du heraus, welche welche ist?", "opts": ["Mit Bromwasser: Nur Hex-1-en entfärbt es.", "Mit Bromwasser: Nur Cyclohexan entfärbt es.", "Mit Wasser: Nur Cyclohexan löst sich.", "Gar nicht, die Stoffe sind identisch."], "a": 0, "why": "Hex-1-en hat eine Doppelbindung, an die Brom addiert wird. Cyclohexan hat nur Einfachbindungen. Beide haben dieselbe Summenformel, sind aber verschiedene Stoffe (Isomere)."}]}, {"type": "note", "title": "Auf dein Arbeitsblatt", "items": ["Bromwasser-Test: Was beobachtest du bei Alken und Alkin, was bei Alkan und Cycloalkan?", "Was sagt die Entfärbung über den Bau des Moleküls aus?", "Was bedeutet Addition?"]}, {"type": "text", "html": "<h3>Siedetemperaturen</h3>\n<p>Alle diese Stoffe sind <b>unpolar</b>. Zwischen den Molekülen wirken nur schwache van-der-Waals-Kräfte. Sie lösen sich nicht in Wasser (<b>hydrophob</b>) und brennen mit leuchtender, rußender Flamme.</p>"}, {"type": "chart", "title": "Siedetemperaturen im Vergleich", "intro": "Schiebe den Regler und schalte Reihen ein und aus. Was fällt dir bei den Siedetemperaturen auf? Vergleiche die Stoffklassen bei gleicher C-Zahl. Werte gerundet; Ethin geht bei −84 °C direkt vom festen in den gasförmigen Zustand über.", "xs": [2, 3, 4, 5, 6, 7], "xlabel": "Anzahl der C-Atome", "ylabel": "Siedetemperatur in °C", "unit": "°C", "series": [{"name": "Alkan", "color": "#2f6fed", "pts": {"2": -89, "3": -42, "4": -0.5, "5": 36, "6": 69, "7": 98}}, {"name": "Alken", "color": "#1aa86b", "pts": {"2": -104, "3": -48, "4": -6, "5": 30, "6": 63, "7": 94}}, {"name": "Alkin", "color": "#d6336c", "pts": {"2": -84, "3": -23, "4": 8, "5": 40, "6": 71, "7": 100}}, {"name": "Cycloalkan", "color": "#e8890c", "pts": {"3": -33, "4": 12, "5": 49, "6": 81, "7": 119}}]}, {"type": "text", "html": "<h4>Ringe unter Spannung</h4>\n<p>Im Dreiring (Cyclopropan) sind die Bindungswinkel nur 60° statt der üblichen 109,5°. Der kleine Ring steht unter <b>Spannung</b> und reagiert leichter. Cyclopentan und Cyclohexan sind fast spannungsfrei und stabil.</p>"}, {"type": "note", "title": "Auf dein Arbeitsblatt", "items": ["Wie ändern sich die Siedetemperaturen mit der Kettenlänge? Warum?", "Alken, Alkan, Alkin und Ring bei gleicher C-Zahl: Was ist höher, was tiefer?"]}]}, "ver": {"name": "Verwendung", "icon": "🛠️", "x": 84, "y": 79, "lead": "Von der Banane bis zur Plastiktüte: Wo stecken diese Stoffe drin?", "blocks": [{"type": "text", "html": "<h3>Rohstoff aus dem Erdöl</h3>\n<p>Alkene entstehen kaum in der Natur, werden aber in riesigen Mengen gebraucht. Man gewinnt sie durch <b>Cracken</b>: Im <b>Steamcracker</b> spaltet man bei etwa 800 °C lange Alkane aus dem Erdöl in kurze Moleküle. Dabei entstehen vor allem <b>Ethen</b> und <b>Propen</b>. Sie gehören zu den wichtigsten Grundstoffen der chemischen Industrie.</p>"}, {"type": "order", "title": "Vom Erdöl zur Plastiktüte", "intro": "Bringe die Schritte in die richtige Reihenfolge.", "items": ["Erdöl wird destilliert, Rohbenzin (Naphtha) wird abgetrennt.", "Im Steamcracker werden die Alkane bei hoher Temperatur gespalten.", "Es entsteht Ethen.", "Viele Ethen-Moleküle verbinden sich zu langen Ketten (Polymerisation).", "Es entsteht Polyethylen (PE).", "Aus PE werden Folien, Tüten und Flaschen hergestellt."]}, {"type": "text", "html": "<h3>Wichtige Stoffe und ihre Einsätze</h3>\n<ul><li><b>Ethen:</b> Reifegas für Obst und Ausgangsstoff für Polyethylen (PE). Daraus kann man auch Ethanol herstellen (Thema 2).</li>\n<li><b>Propen:</b> Ausgangsstoff für Polypropylen (PP), z. B. für Joghurtbecher und Kisten.</li>\n<li><b>Ethin (Acetylen):</b> Gas für Schweißbrenner. Mit Sauerstoff brennt es mit über 3000 °C.</li>\n<li><b>Cyclohexan:</b> Lösungsmittel und Grundstoff für Nylon.</li>\n<li><b>Cyclopropan:</b> wurde früher als Narkosegas eingesetzt.</li></ul>"}, {"type": "match", "title": "Wer macht was?", "intro": "Ordne den Stoff seiner Verwendung zu.", "pairs": [["Ethen", "Reifegas für Bananen, Ausgangsstoff für Plastiktüten"], ["Propen", "Ausgangsstoff für Joghurtbecher (Polypropylen)"], ["Ethin", "Schweißbrenner"], ["Cyclohexan", "Lösungsmittel und Grundstoff für Nylon"], ["Cyclopropan", "früher Narkosegas"]]}, {"type": "quiz", "title": "Alltagsfragen", "qs": [{"q": "Warum sollte man Bananen nicht direkt neben reife Äpfel legen?", "opts": ["Äpfel geben Ethen ab. Es lässt die Bananen schneller reifen.", "Äpfel nehmen den Bananen den Sauerstoff weg.", "Bananen und Äpfel reagieren zu Ethin.", "Äpfel sind schwerer und drücken die Bananen."], "a": 0, "why": "Reife Äpfel setzen Ethen frei. Es ist ein Pflanzenhormon und beschleunigt das Reifen von Früchten."}, {"q": "Aus Ethen kann man Polyethylen herstellen, aus Ethan nicht. Warum?", "opts": ["Ethen hat eine Doppelbindung. Sie kann aufgehen und die Moleküle verknüpfen.", "Ethan ist zu schwer.", "Ethan ist giftig.", "Ethen ist flüssig."], "a": 0, "why": "Bei der Polymerisation öffnet sich die Doppelbindung. Ethan hat keine Doppelbindung."}, {"q": "Welches Gas brennt mit Sauerstoff so heiß, dass man damit Metall schweißen kann?", "opts": ["Ethin", "Ethen", "Ethan", "Cyclohexan"], "a": 0, "why": "Die Ethin-Sauerstoff-Flamme erreicht über 3000 °C."}]}, {"type": "note", "title": "Auf dein Arbeitsblatt", "items": ["Wie gewinnt man Ethen und Propen? (Cracken, Steamcracker)", "Zwei Verwendungen von Ethen, eine von Ethin, eine von einem Cycloalkan", "Was passiert bei der Polymerisation von Ethen?"]}]}, "nom": {"name": "Nomenklatur", "icon": "🏷️", "x": 50, "y": 41, "lead": "So bekommen Doppelbindungen, Dreifachbindungen und Ringe ihre Namen.", "blocks": [{"type": "text", "html": "<h3>Die Regeln</h3>\n<ol><li><b>Stamm</b> nach der Zahl der C-Atome in der längsten Kette:</li></ol><table class=\"tbl\"><tr><th>C-Atome</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr>\n<tr><th>Stamm</th><td>Meth</td><td>Eth</td><td>Prop</td><td>But</td><td>Pent</td><td>Hex</td><td>Hept</td><td>Okt</td></tr></table>\n<ol start=\"2\"><li><b>Endung</b> nach der Bindung: <b>-an</b> (nur Einfachbindungen), <b>-en</b> (Doppelbindung), <b>-in</b> (Dreifachbindung).</li>\n<li><b>Lage der Mehrfachbindung:</b> Die Kette wird so nummeriert, dass die Mehrfachbindung die <b>kleinstmögliche Zahl</b> bekommt. Die Zahl steht vor der Endung: <b>But-1-en</b>. Bei Ethen, Propen, Ethin und Propin ist keine Zahl nötig.</li>\n<li><b>Ringe:</b> Vor den Namen kommt <b>Cyclo-</b>: Cyclohexan, Cyclohexen.</li></ol>\n<p><small>In älteren Büchern steht die Zahl vorne: 1-Buten. Das ist dasselbe wie But-1-en.</small></p>"}, {"type": "builder", "mode": "hc", "title": "Namens-Baukasten", "intro": "Baue Stoffe zusammen und schau, wie sie heißen. Probiere auch mehrere Lagen der Doppelbindung aus."}, {"type": "quiz", "title": "Wie heißt der Stoff?", "qs": [{"mol": ["en", 4, 1], "wrong": ["But-2-en", "But-3-en", "Butan"]}, {"mol": ["en", 4, 2], "wrong": ["But-1-en", "But-3-en", "Buten-3"], "why": "Die Doppelbindung liegt in der Mitte. Von beiden Seiten gezählt bekommt sie die 2."}, {"mol": ["in", 3, 1], "wrong": ["Propen", "Propan", "Cyclopropan"]}, {"mol": ["cyc", 5, false], "wrong": ["Pentan", "Cyclopenten", "Pent-1-en"]}, {"mol": ["en", 6, 3], "wrong": ["Hex-4-en", "Hex-2-en", "Hex-1-en"]}, {"q": "Welcher Name ist falsch?", "opts": ["But-3-en", "Ethen", "Cyclohexan", "Pent-2-in"], "a": 0, "why": "Man zählt vom Kettenende, an dem die Doppelbindung die kleinere Zahl bekommt. Aus But-3-en wird But-1-en."}]}, {"type": "sort", "title": "Alkan, Alken, Alkin oder Ring?", "intro": "Welche Stoffklasse verrät der Name?", "cats": ["Alkan", "Alken", "Alkin", "Cycloalkan"], "items": [["Propan", 0], ["Pent-2-en", 1], ["But-1-in", 2], ["Cyclobutan", 3], ["Hept-3-en", 1], ["Propin", 2], ["Octan", 0], ["Cyclopentan", 3]]}, {"type": "note", "title": "Auf dein Arbeitsblatt", "items": ["Die Endungen -an, -en, -in und die Vorsilbe Cyclo-", "Die Nummerierungsregel mit einem Beispiel (Strukturformel und Name)"]}]}}, "hash": "1d2hndn114v"};

function hashStr(s){s=s.trim().toLowerCase();let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36);}

const STEM=['','meth','eth','prop','but','pent','hex','hept','oct','non','dec'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ALKYL=['','methyl','ethyl','propyl','butyl','pentyl','hexyl'];
function lowLoc(set,n){const a=[...set].sort((x,y)=>x-y),b=[...set].map(p=>n+1-p).sort((x,y)=>x-y);for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i]?a:b;}return a;}
function buildMol(seq,bonds,subs){
  const n=seq.length,atoms=[];
  for(let i=0;i<n;i++){
    const a={e:seq[i],i,slots:{up:null,down:null,left:null,right:null}};
    const s=(subs&&subs[i])||{};
    ['up','down'].forEach(k=>{if(s[k])a.slots[k]=s[k];});
    let used=(i>0?(bonds[i-1]||1):0)+(i<n-1?(bonds[i]||1):0);
    ['up','down'].forEach(k=>{const g=a.slots[k];if(g)used+=g[0]==='='?2:1;});
    let hc=(a.e==='O'?2:4)-used;
    const free=['up','down','left','right'].filter(k=>!a.slots[k]&&(k==='up'||k==='down'||(k==='left'&&i===0)||(k==='right'&&i===n-1)));
    const end=free.filter(k=>k==='left'||k==='right'),vert=free.filter(k=>k==='up'||k==='down');
    let order;
    if(n===1&&hc===2&&a.e==='O')order=['left','right'];
    else if(hc===1)order=end.concat(['down','up'].filter(k=>vert.includes(k)));
    else if(hc===2)order=['up','down'].filter(k=>vert.includes(k)).concat(end);
    else order=end.concat(['up','down'].filter(k=>vert.includes(k)));
    for(const k of order){if(hc<=0)break;a.slots[k]='H';hc--;}
    atoms.push(a);
  }
  const bd=[];for(let i=0;i<n-1;i++)bd.push(bonds[i]||1);
  return {atoms,bonds:bd};
}
function countF(m){let C=0,H=0,O=0;m.atoms.forEach(a=>{if(a.e==='C')C++;if(a.e==='O')O++;Object.values(a.slots).forEach(g=>{if(!g)return;if(g==='H')H++;else if(g==='OH'){O++;H++;}else if(g==='=O')O++;});});return {C,H,O};}
function fstr(c){return sub('C'+(c.C>1?c.C:'')+'H'+c.H+(c.O?'O'+(c.O>1?c.O:''):''));}
function semi(m){
  const n=m.atoms.length,parts=[];
  m.atoms.forEach((a,i)=>{
    if(a.e==='O'){parts.push('O');return;}
    const sl=Object.values(a.slots),hs=sl.filter(g=>g==='H').length,dbO=sl.includes('=O'),oh=sl.filter(g=>g==='OH').length;
    let lab;
    if(dbO&&oh)lab=(hs?'H':'')+'COOH';
    else if(dbO){lab=(n===1)?'CH'+sub(2)+'=O':(i===n-1&&hs===1?'CHO':(hs?'H':'')+'CO');}
    else{
      lab='C'+(hs?'H'+(hs>1?sub(hs):''):'');
      if(oh){
        if(i===0&&n>1)lab='HO–'+lab;
        else if(i===n-1)lab=lab+'–OH';
        else lab+='(OH)'.repeat(oh);
      }
    }
    parts.push(lab);
  });
  let s=parts[0];
  for(let i=1;i<n;i++){const b=m.bonds[i-1];s+=(b===3?'≡':b===2?'=':'–')+parts[i];}
  return s;
}
function drawMol(m){
  const gap=50,r=10,mx=46,cy=62,n=m.atoms.length,W=(n-1)*gap+2*mx,Hh=124;
  const COL={C:'#1b2540',O:'#d62839',H:'#6b7280'};
  let s=`<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" font-size="17" role="img">`;
  const ln=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||'#1b2540'}" stroke-width="2.4" stroke-linecap="round"/>`;
  for(let i=0;i<n-1;i++){
    const x1=mx+i*gap+r+1,x2=mx+(i+1)*gap-r-1,o=m.bonds[i],offs=o===1?[0]:o===2?[-3.5,3.5]:[-5.5,0,5.5];
    offs.forEach(d=>s+=ln(x1,cy+d,x2,cy+d));
  }
  const lab=(txt,x,y)=>{
    let t=txt;
    if(txt==='OH')return `<text x="${x}" y="${y}" text-anchor="middle" font-weight="700"><tspan fill="${COL.O}">O</tspan><tspan fill="${COL.H}">H</tspan></text>`;
    if(txt==='HO')return `<text x="${x}" y="${y}" text-anchor="middle" font-weight="700"><tspan fill="${COL.H}">H</tspan><tspan fill="${COL.O}">O</tspan></text>`;
    const c=txt==='H'?COL.H:txt==='=O'?COL.O:COL.C;
    return `<text x="${x}" y="${y}" text-anchor="middle" font-weight="700" fill="${c}">${txt==='=O'?'O':txt}</text>`;
  };
  m.atoms.forEach(a=>{
    const x=mx+a.i*gap;
    s+=`<text x="${x}" y="${cy+6}" text-anchor="middle" font-weight="800" font-size="19" fill="${COL[a.e]}">${a.e}</text>`;
    Object.entries(a.slots).forEach(([k,g])=>{
      if(!g)return;
      const dbl=g==='=O',name=g==='=O'?'=O':g;
      if(k==='up'||k==='down'){
        const dy=k==='up'?-1:1,y1=cy+dy*(r+1),y2=cy+dy*(r+19);
        if(dbl){s+=ln(x-3.5,y1,x-3.5,y2)+ln(x+3.5,y1,x+3.5,y2);}else s+=ln(x,y1,x,y2);
        s+=lab(name,x,cy+dy*(r+19+(k==='up'?8:21))+(k==='up'?0:-0));
      }else{
        const dx=k==='left'?-1:1,x1=x+dx*(r+1),x2=x+dx*(r+20);
        s+=ln(x1,cy,x2,cy);
        s+=lab(name==='OH'&&k==='left'?'HO':name,x+dx*(r+20+10),cy+6);
      }
    });
  });
  return s+'</svg>';
}
function drawRing(n,db){
  const R=n===3?30:36,cx=60,cy=62;let pts=[];
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  let s=`<svg viewBox="0 0 120 124" width="120" height="124" xmlns="http://www.w3.org/2000/svg" role="img"><polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#1b2540" stroke-width="2.6" stroke-linejoin="round"/>`;
  if(db){const p=pts[0],q=pts[1],f=0.78,mid=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    const a=[cx+(p[0]-cx)*f,cy+(p[1]-cy)*f],b=[cx+(q[0]-cx)*f,cy+(q[1]-cy)*f];
    const sh=(u,v,t)=>[u[0]+(v[0]-u[0])*t,u[1]+(v[1]-u[1])*t];
    const a2=sh(a,b,.14),b2=sh(b,a,.14);
    s+=`<line x1="${a2[0].toFixed(1)}" y1="${a2[1].toFixed(1)}" x2="${b2[0].toFixed(1)}" y2="${b2[1].toFixed(1)}" stroke="#1b2540" stroke-width="2.6" stroke-linecap="round"/>`;}
  return s+'</svg>';
}
/* mol(kind,…) liefert {name,alt,formula,semi,svg,gen} */
function mol(kind,a1,a2,a3){
  let m,name,alt='',gen='',ring=null;
  const st=n=>STEM[n];
  switch(kind){
    case 'alkan':{m=buildMol('C'.repeat(a1),[],{});name=cap(st(a1))+'an';gen='Alkan: CₙH₂ₙ₊₂';break;}
    case 'en':case 'in':{const n=a1,p=a2||1,o=kind==='en'?2:3,b=[];b[p-1]=o;m=buildMol('C'.repeat(n),b,{});
      const suf=kind==='en'?'en':'in';
      name=n<=3?cap(st(n))+suf:cap(st(n))+'-'+Math.min(p,n-p)+'-'+suf;
      gen=kind==='en'?'Alken: CₙH₂ₙ':'Alkin: CₙH₂ₙ₋₂';break;}
    case 'cyc':{const n=a1,db=!!a2;ring={n,db};const C=n,Hh=db?2*n-2:2*n;m={atoms:[],bonds:[],cnt:{C,H:Hh,O:0}};
      name='Cyclo'+st(n)+(db?'en':'an');gen=db?'Cycloalken: CₙH₂ₙ₋₂':'Cycloalkan: CₙH₂ₙ';break;}
    case 'ol':{const n=a1,pos=a2,subs={};pos.forEach(p=>subs[p-1]={up:'OH'});m=buildMol('C'.repeat(n),[],subs);
      const L=lowLoc(pos,n),mult=['','','di','tri','tetra'][pos.length];
      name=(pos.length===1&&n<=2)?cap(st(n))+'anol':cap(st(n))+'an-'+L.join(',')+'-'+mult+'ol';
      gen=['','einwertiger','zweiwertiger','dreiwertiger'][pos.length]+' Alkohol';break;}
    case 'al':{m=buildMol('C'.repeat(a1),[],{[a1-1]:{up:'=O'}});name=cap(st(a1))+'anal';gen='Alkanal (Aldehyd): –CHO';break;}
    case 'on':{const n=a1,p=a2;m=buildMol('C'.repeat(n),[],{[p-1]:{up:'=O'}});
      name=n<=4?cap(st(n))+'anon':cap(st(n))+'an-'+Math.min(p,n+1-p)+'-on';gen='Alkanon (Keton): –CO–';break;}
    case 'acid':{m=buildMol('C'.repeat(a1),[],{[a1-1]:{up:'=O',down:'OH'}});name=cap(st(a1))+'ansäure';gen='Alkansäure: –COOH';break;}
    case 'ester':{const na=a1,nal=a2;m=buildMol('C'.repeat(na)+'O'+'C'.repeat(nal),[],{[na-1]:{up:'=O'}});
      name=cap(st(na))+'ansäure'+ALKYL[nal]+'ester';alt=cap(ALKYL[nal])+st(na)+'anoat';gen='Ester: –COO–';break;}
    case 'h2o':{m=buildMol('O',[],{});name='Wasser';break;}
    default:throw new Error('mol '+kind);
  }
  let formula,sm,svg;
  if(ring){formula=fstr({C:ring.n,H:m.cnt.H,O:0});sm='';svg=drawRing(ring.n,ring.db);}
  else{formula=fstr(countF(m));sm=semi(m);svg=drawMol(m);}
  if(kind==='h2o'){formula=sub('H2O');sm='H–O–H';}
  return {name,alt,formula,semi:sm,svg,gen,kind};
}

function wQuiz(b,host,done){
  host.innerHTML=head(b,'Quiz');
  const box=h('div');host.appendChild(box);
  let qi=0,score=0,tried;
  function render(){
    if(qi>=b.qs.length){
      box.innerHTML='<div class="res ok">Geschafft: '+score+' von '+b.qs.length+' sofort richtig.</div>';
      const r=h('button','btn small','Nochmal');r.style.marginTop='8px';r.onclick=()=>{qi=0;score=0;render();};box.appendChild(r);done();return;}
    const q=b.qs[qi];tried=false;
    let opts,corr,mm=null,qtxt=q.q;
    if(q.mol){mm=mol.apply(null,q.mol);qtxt=q.q||'Wie heißt dieser Stoff?';
      if(q.opts){const idx=shuffle(q.opts.map((o,i)=>i));opts=idx.map(i=>q.opts[i]);corr=idx.indexOf(q.a);}
      else{const all=shuffle([mm.name].concat(q.wrong));opts=all;corr=all.indexOf(mm.name);}}
    else{const idx=shuffle(q.opts.map((o,i)=>i));opts=idx.map(i=>q.opts[i]);corr=idx.indexOf(q.a);}
    box.innerHTML='<p><b>Frage '+(qi+1)+' von '+b.qs.length+'</b></p>'+(mm?'<div class="mol">'+mm.svg+'</div>':'')+'<p>'+qtxt+'</p>';
    const g=h('div','qopts');
    opts.forEach((o,i)=>{const ob=h('button','opt',o);ob.type='button';
      ob.onclick=()=>{
        if(ob.classList.contains('ok')||g.dataset.fin)return;
        if(i===corr){ob.classList.add('ok');g.dataset.fin='1';if(!tried)score++;
          const why=q.why||(mm&&!q.opts?('<b>'+mm.name+'</b> · '+mm.formula):'');
          if(why)g.after(Object.assign(h('div','why',why)));
          const nx=h('button','btn small',qi+1<b.qs.length?'Weiter ▶':'Fertig');nx.style.marginTop='10px';nx.onclick=()=>{qi++;render();};box.appendChild(nx);
        }else{ob.classList.add('bad');tried=true;}
      };g.appendChild(ob);});
    box.appendChild(g);
  }
  render();
}

function wLab(b,host,done){

    c.onclick=()=>{cur=sm;stage=0;[...chips.children].forEach(x=>x.classList.remove('sel'));c.classList.add('sel');paint([[sm.c||'#cfe6ff',.5]],false);b2.disabled=false;b3.disabled=true;obs.innerHTML='<i>'+sm.name+' im Reagenzglas.</i>';};
    sm.chip=c;chips.appendChild(c);});
  b2.onclick=()=>{if(!cur)return;stage=1;paint(cur.mix||[[cur.c||'#cfe6ff',.4],[b.reagentColor,.3]],false);b2.disabled=true;b3.disabled=false;obs.innerHTML='<i>'+b.addLabel+'. Noch keine Veränderung sichtbar.</i>';};

    setTimeout(()=>{paint(cur.end,!!cur.mirror);obs.innerHTML='<b>Beobachtung:</b> '+cur.obs;tested[cur.name]=1;cur.chip.classList.add('sel');cur.chip.insertAdjacentHTML('beforeend',' ✔');updCnt();if(Object.keys(tested).length===b.samples.length)done();},700);};

function wBuilder(b,host,done){
  host.innerHTML=head(b,'Baukasten');
  const bld=h('div','bld'),out=h('div','out');host.append(bld,out);
  const st={n:b.n0||3,t:b.t0||0,p:1,pos:[1],acid:2,alc:2,ctype:'al'};
  const stepper=(label,get,set,min,max)=>{const r=h('div','row');r.appendChild(h('span','lbl',label));const s=h('span','stp'),mn=h('button','','−'),o=h('output','',get()),pl=h('button','','+');mn.type=pl.type='button';
    mn.onclick=()=>{if(get()>min){set(get()-1);upd();}};pl.onclick=()=>{if(get()<max){set(get()+1);upd();}};s.append(mn,o,pl);r.appendChild(s);r._o=o;r._get=get;return r;};
  const seg=(label,opts,get,set)=>{const r=h('div','row');r.appendChild(h('span','lbl',label));const c=h('div','chips');opts.forEach(([k,t])=>{const bt=h('button','chip',t);bt.type='button';bt.onclick=()=>{set(k);upd();};bt._k=k;c.appendChild(bt);});r.appendChild(c);r._c=c;r._get=get;return r;};

    const r1=seg('Stoffklasse',T,()=>T[st.t][0],k=>{st.t=T.findIndex(x=>x[0]===k);}),r2=stepper('C-Atome',()=>st.n,v=>st.n=v,1,8);
    const r3=stepper('Lage der Bindung',()=>st.p,v=>st.p=v,1,4);
    rows.push(r1,r2,r3);
    result=()=>{const k=T[st.t][0];let n=st.n;
      if(k==='en'||k==='in'){n=Math.max(n,2);}
      if(k==='cyc'||k==='cycen')n=Math.max(n,3);
      const maxp=(k==='en'||k==='in')?Math.max(1,Math.floor(n/2)):1;
      if(st.p>maxp)st.p=maxp;if(st.p<1)st.p=1;
      st.n=n;r2._o.textContent=n;r3._o.textContent=st.p;
      r3.style.display=(k==='en'||k==='in')&&n>=4?'flex':'none';
      r3.querySelectorAll('button')[1].disabled=st.p>=maxp;
      return k==='alkan'?mol('alkan',n):k==='en'?mol('en',n,st.p):k==='in'?mol('in',n,st.p):k==='cyc'?mol('cyc',n,false):mol('cyc',n,true);};
    var minN={alkan:1,en:2,in:2,cyc:3,cycen:3};
    r2.querySelectorAll('button')[0].onclick=()=>{const k=T[st.t][0];if(st.n>minN[k]){st.n--;upd();}};
  }else if(b.mode==='ol'){
    const r2=stepper('C-Atome',()=>st.n,v=>{st.n=v;st.pos=st.pos.filter(p=>p<=v);if(!st.pos.length)st.pos=[1];},1,6);
    const r3=h('div','row');r3.appendChild(h('span','lbl','OH-Gruppen'));const cc=h('div','chips');r3.appendChild(cc);rows.push(r2,r3);
    result=()=>{r2._o.textContent=st.n;cc.innerHTML='';for(let i=1;i<=st.n;i++){const c=h('button','cpos'+(st.pos.includes(i)?' sel':''),'C'+i);c.type='button';c.setAttribute('aria-label','OH an Kohlenstoff '+i);c.onclick=()=>{if(st.pos.includes(i)){if(st.pos.length>1)st.pos=st.pos.filter(p=>p!==i);}else if(st.pos.length<3){st.pos=st.pos.concat(i).sort((a,b)=>a-b);}upd();};cc.appendChild(c);}return mol('ol',st.n,st.pos);};
  }else if(b.mode==='co'){
    const T=[['al','Aldehyd'],['on','Keton'],['acid','Carbonsäure']];
    const r1=seg('Stoffklasse',T,()=>st.ctype,k=>{st.ctype=k;}),r2=stepper('C-Atome',()=>st.n,v=>st.n=v,1,6),r3=stepper('Lage der C=O-Gruppe',()=>st.p,v=>st.p=v,2,3);
    rows.push(r1,r2,r3);
    result=()=>{let n=st.n;if(st.ctype==='on')n=Math.max(n,3);st.n=n;r2._o.textContent=n;const maxp=Math.max(2,Math.floor((n+1)/2));if(st.p>maxp)st.p=maxp;if(st.p<2)st.p=2;r3._o.textContent=st.p;
      r3.style.display=st.ctype==='on'&&n>=5?'flex':'none';r3.querySelectorAll('button')[1].disabled=st.p>=maxp;
      r2.querySelectorAll('button')[0].onclick=()=>{if(st.n>(st.ctype==='on'?3:1)){st.n--;upd();}};
      return st.ctype==='al'?mol('al',n):st.ctype==='acid'?mol('acid',n):mol('on',n,st.p);};
  }else if(b.mode==='ester'){
    const r1=stepper('Säure (C-Atome)',()=>st.acid,v=>st.acid=v,1,4),r2=stepper('Alkohol (C-Atome)',()=>st.alc,v=>st.alc=v,1,5);rows.push(r1,r2);
