    <style>
        html, body { margin: 0; padding: 0; background: #000; font-family: sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

        /* Bühne mit festem Seitenverhältnis des Bildes, damit die Klickflächen auf jedem Gerät passen */
        .table-container {
            --w: min(100vw, calc(100vh * 1280 / 698));
            position: relative;
            width: var(--w);
            aspect-ratio: 1280 / 698;
            margin: 0 auto;
        }
        .table-container img { display: block; width: 100%; height: 100%; }

        .lab-link {
            position: absolute;
            display: block;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lab-link:hover, .lab-link:focus-visible {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        /* Klickflächen (Gegenstand samt Beschriftung im Bild) */
        .link-7-8  { left: 15.6%; top: 27.2%; width: 27.7%; height: 51.3%; }
        .link-9-10 { left: 58.2%; top: 18.6%; width: 31.0%; height: 59.9%; }

        /* Zurück-Link */
        .back-link {
            position: absolute;
            left: 1.2%;
            bottom: 2%;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 0.6em 1.2em;
            border-radius: 8px;
            font-size: max(11px, calc(var(--w) * 0.0105));
        }
        .back-link:hover { background: rgba(0,0,0,0.6); }
    </style>
</head>
<body>

        <a href="./Klasse-9-10/index.html" class="lab-link link-9-10" title="Klasse 9/10"></a>

        <a href="../index.html" class="back-link">← Zurück zur Startseite</a>
    </div>
