    var rr = mk('div', 'row'); rr.appendChild(btn(res.solved ? '↻ Anderes Löschmittel testen' : '↻ Nochmal versuchen', res.solved ? 'sec' : '', function () { loadScene(id); S.res = null; panel(); }));
    var idx = ORDER.indexOf(id), allDone = ORDER.every(function (k) { return sol[k]; });
    if (res.solved && allDone) rr.appendChild(btn('Weiter zum Fazit →', 'go', function () { goStep(4); }));
    else if (res.solved) rr.appendChild(btn('Nächster Brand →', 'go', function () { var nx = ORDER.filter(function (k) { return !sol[k]; })[0]; loadScene(nx); S.res = null; panel(); }));
    p.appendChild(rr);
  }
  p.appendChild(mk('p', 'muted', 'Gelöscht: <b>' + ORDER.filter(function (k) { return sol[k]; }).length + ' von 6</b> Bränden.')); p.lastChild.style.marginTop = '12px';
}
var QF = [['Warum darf man brennendes Fett nicht mit Wasser löschen?', ['Das Wasser verdampft schlagartig und schleudert brennendes Fett auf', 'Wasser löst das Fett auf', 'Wasser ist leichter als Fett und brennt mit', 'Wasser kühlt zu stark'], 'Wasser sinkt unter das Fett und verdampft dort explosionsartig.'],
  ['Welche Löschwirkung hat eine Löschdecke?', ['Ersticken', 'Abkühlen', 'Brennstoff entfernen', 'Brennstoff verdünnen'], 'Sie schneidet den Brandherd vom Sauerstoff ab.'],
  ['Warum eignet sich CO₂ für Brände an Geräten unter Spannung?', ['Es leitet keinen Strom und hinterlässt keine Rückstände', 'Es kühlt am stärksten', 'Es ist leichter als Luft', 'Es reagiert mit dem Strom'], 'Ein nichtleitendes Gas ohne Rückstände.'],
  ['Was passiert, wenn man brennendes Magnesium mit Wasser löscht?', ['Es entsteht brennbarer Wasserstoff, der Brand wird heftiger', 'Das Magnesium wird abgekühlt und erlischt', 'Es bildet sich eine Schutzschicht', 'Das Wasser verdampft ohne Wirkung'], 'Mg + H₂O → MgO + H₂, und der Wasserstoff verbrennt.'],
  ['Du schließt bei einem Brand das Ventil der Gasleitung. Welches Verfahren ist das?', ['Brennstoff entfernen', 'Ersticken', 'Abkühlen', 'Verdünnen'], 'Ohne Gaszufuhr fehlt der Brennstoff.'],
  ['Eine Person brennt. Was ist richtig?', ['Hinlegen und mit Decke oder Wasser löschen', 'Wegrennen, um Hilfe zu holen', 'Mit dem Pulverlöscher besprühen', 'Ruhig stehen bleiben und warten'], 'Rennen facht das Feuer an, Pulver verletzt Augen und Atemwege.']];
function pStep4(p) {
  p.appendChild(mk('h2', '', '4 · Fazit'));
  p.appendChild(mk('p', 'muted', 'Dein Löschmittel-Check: <b>✔</b> hat funktioniert, <b>✘</b> war falsch oder gefährlich. Leere Felder hast du nicht ausprobiert.'));
  var tb = '<table class="mx"><tr><th></th>' + TOOLS.map(function (t) { return '<th>' + t[1] + '<br>' + t[2] + '</th>'; }).join('') + '</tr>';
  ORDER.forEach(function (k) { tb += '<tr><td>' + SCN[k].name + '</td>' + TOOLS.map(function (t) { var o = (S.tr.tried[k] || {})[t[0]]; return o ? ((o === 'good' || o === 'ok') ? '<td class="g">✔</td>' : '<td class="b">✘</td>') : '<td></td>'; }).join('') + '</tr>'; });
  p.appendChild(mk('div', '', tb + '</table>'));
  var ul = mk('ul', 'rules'); ['<b>Eigene Sicherheit zuerst:</b> Nur kleine Brände löschen, den Fluchtweg im Rücken.', '<b>Alarm:</b> Notruf 112, andere warnen, bei Gefahr den Raum verlassen.', '<b>Brennstoff entfernen:</b> Strom und Gas abstellen, wenn es sicher geht.', '<b>Wasser nie</b> auf brennendes Fett, Öl, Elektrogeräte unter Spannung oder Metalle.', '<b>Brennende Person:</b> nicht rennen, hinlegen und mit Decke oder Wasser löschen.', '<b>Brandklassen:</b> A feste Stoffe, B Flüssigkeiten, C Gase, D Metalle, F Speisefette und -öle.'].forEach(function (t) { ul.appendChild(mk('li', '', t)); }); p.appendChild(ul);
  p.appendChild(mk('h3', '', 'Wissens-Check')); p.lastChild.style.marginTop = '14px';
  var Q = S.quiz; if (!Q) Q = S.quiz = { list: shuffle(QF).slice(0, 5), i: 0, ok: 0, done: false };
  if (Q.done) { p.appendChild(mk('div', 'fb ok', '<b>' + Q.ok + ' von ' + Q.list.length + ' richtig.</b>')); var r = mk('div', 'row'); r.appendChild(btn('Check wiederholen', 'sec', function () { S.quiz = null; panel(); })); r.appendChild(btn('Zurück zum Training', 'sec', function () { goStep(3); })); p.appendChild(r); return; }
  var q = Q.list[Q.i], once = false; p.appendChild(mk('p', '', '<b>' + (Q.i + 1) + '/' + Q.list.length + ' · ' + q[0] + '</b>'));
  mcq(p, q[1], 0, function () { if (once) return; once = true; Q.ok++; p.appendChild(mk('div', 'fb ok', '✔ Richtig. ' + q[2])); var rr = mk('div', 'row'); rr.appendChild(btn(Q.i + 1 >= Q.list.length ? 'Ergebnis' : 'Weiter', '', function () { Q.i++; if (Q.i >= Q.list.length) Q.done = true; panel(); })); p.appendChild(rr); });
}
function panel() { var p = $('panel'); p.innerHTML = ''; renderSteps(); renderTools(); ({ 1: pStep1, 2: pStep2, 3: pStep3, 4: pStep4 })[S.step](p); }

/* ====== Eingabe & Schleife ====== */
var cv = $('cv'), ctx = cv.getContext('2d'), PT = null, lastW = 0, userRot = false;
cv.addEventListener('pointerdown', function (e) { PT = { lx: e.clientX, x0: e.clientX, y0: e.clientY }; userRot = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { } });
cv.addEventListener('pointermove', function (e) { if (!PT) return; cam.yaw += (e.clientX - PT.lx) * 0.012; PT.lx = e.clientX; });
cv.addEventListener('pointerup', function (e) {
  var d = PT && Math.hypot(e.clientX - PT.x0, e.clientY - PT.y0); PT = null;
  if (d === null || d === undefined || d > 8 || S.step !== 3 || S.run || S.res) return;
  var r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * CW, my = (e.clientY - r.top) / r.height * CH, hit = null, best = 1e9;
  S.prims.forEach(function (b) { if (!b.hot) return; var q = proj(b.x, b.y + 4, b.z), dd = Math.hypot(q.x - mx, q.y - my); if (dd < 26 * cam.S / 1.3 + 8 && dd < best) { best = dd; hit = b.hot; } });
  if (hit === 'knob' && !S.fx.off) {
    S.fx.off = true; S.prims.forEach(function (b) { if (b.hot === 'knob') { b.c = '#6b707a'; b.rgb = null; } }); showBanner('Herd ausgeschaltet', 2400);
  } else if (hit === 'lid') {
    use3('lid', S.fx.off ? ['good', 'Herd aus und Deckel drauf: Dem Feuer fehlt der Sauerstoff, es erstickt. Den Deckel geschlossen lassen, bis das Fett abgekühlt ist, sonst flammt es wieder auf.'] : ['reignite', 'Der Deckel erstickt die Flammen, aber die Herdplatte heizt weiter. Das Fett bleibt über der Zündtemperatur und entzündet sich sofort wieder, sobald Luft herankommt. Zuerst den Herd ausschalten.']);
  }
}); cv.addEventListener('pointercancel', function () { PT = null; });
function checkResize() { var w = cv.clientWidth; if (w === lastW && w) return; lastW = w; var dpr = window.devicePixelRatio || 1; cv.width = Math.round(w * dpr); cv.height = Math.round(w * CH / CW * dpr); VS = w / CW * dpr; }
var last = performance.now(), tt = 0, baseYaw = cam.yaw;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000), i, e; last = now; tt += dt;
  checkResize(); ctx.setTransform(VS, 0, 0, VS, 0, 0);
  if (!userRot) cam.yaw = baseYaw + 0.14 * Math.sin(tt * 0.55);
  runStep(dt);
  for (i = 0; i < S.em.length; i++) fireP(S.em[i], S.fire.I, dt);
  if (S.fire.I <= 0.05 && S.smokeT > 0) { S.smokeT -= dt; for (i = 0; i < S.em.length; i++) if (Math.random() < dt * 5) { e = S.em[i]; addP({ k: 'sm', x: e.x + rnd(-e.r, e.r) * 0.5, y: e.y + 10, z: e.z + rnd(-e.r, e.r) * 0.5, vx: rnd(-6, 6), vy: rnd(24, 40), vz: rnd(-6, 6), life: rnd(1.6, 2.4), age: 0, size: rnd(16, 26) }); } }
  stepP(dt);
  renderScene(ctx, tt, dt);
  requestAnimationFrame(frame);
}
loadScene('holz'); panel(); showBanner('↔ Zum Drehen ziehen', 3500); requestAnimationFrame(frame);
