<script>
'use strict';

/* ====== Geometrie des Ofens (Zeichenfläche 600 x 760) ====== */
var CW = 600, CH = 760, CX = 300, TILT = 0.2, WALL = 24;
var PR = [[70, 70], [420, 150], [470, 150], [590, 112], [690, 112]];
var KEYY = [70, 420, 470, 590, 690];
function innerR(y) {
  var i; if (y <= PR[0][0]) return PR[0][1];
  for (i = 1; i < PR.length; i++) if (y <= PR[i][0]) return lerp(PR[i - 1][1], PR[i][1], (y - PR[i - 1][0]) / (PR[i][0] - PR[i - 1][0]));
  return PR[PR.length - 1][1];
}
function outerR(y) { return innerR(y) + WALL; }
var TST = [[70, 200], [170, 400], [300, 900], [470, 1400], [560, 1600], [610, 2000], [690, 1600]];
var CST = [[20, [24, 24, 36]], [200, [96, 28, 22]], [400, [156, 30, 20]], [900, [226, 58, 30]], [1400, [255, 156, 34]], [1600, [255, 210, 62]], [2000, [255, 246, 206]]];
function colAt(T) {

  for (i = 1; i < CST.length; i++) if (T <= CST[i][0]) { t = (T - CST[i - 1][0]) / (CST[i][0] - CST[i - 1][0]); a = CST[i - 1][1]; b = CST[i][1]; return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

}
var ZONES = [
  { id: 'vor', name: 'Vorwärmzone', t: '200 – 400 °C', y0: 70, y1: 170 },
  { id: 'red', name: 'Reduktionszone', t: '400 – 900 °C', y0: 170, y1: 300 },
  { id: 'koh', name: 'Kohlungszone', t: '900 – 1400 °C', y0: 300, y1: 470 },
  { id: 'sch', name: 'Schmelzzone', t: '1400 – 1600 °C', y0: 470, y1: 560 },
  { id: 'ver', name: 'Verbrennungszone', t: 'bis ca. 2000 °C', y0: 560, y1: 610 }
];
function zoneAt(y) { var i; for (i = 0; i < ZONES.length; i++) if (y >= ZONES[i].y0 && y < ZONES[i].y1) return ZONES[i]; return null; }
function zoneById(id) { var i; for (i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i]; return null; }
var HOLE_I = { y: 684, a: 0.85 }, HOLE_S = { y: 640, a: -0.85 };

/* ====== Zustand ====== */
var S;
function freshState() {
  return { step: 1, unlocked: 1, view: 'out', yaw: 0.0, auto: true, speed: 1, gasOn: true, selZone: null,
    aufg: { mode: 'explore', sel: null, queue: [], idx: 0, ok: 0, fb: '', done: false, wrong: 0 },
    charge: [], parts: [], bell: 0, tipsB: 0, run: null, eq: {}, cap: '', hs: [],

/* ====== Beschickung ====== */
function makeLayer(type, idx) {

  for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {

}
function addLayer(t) {

function resetCharge() { S.charge = []; S.parts = []; S.run = null; S.tipsB = 0; S.tap = { iron: false, slag: false, ironOut: 0, slagOut: 0, qDone: false, fb: '', order: [] }; S.konv = null; S.eq = {}; S.selZone = null; }

function newRun() {

    ironTot: Math.min(0.95, 0.31 * e * ausb), slagTot: Math.min(0.95, 0.1 * e + 0.22 * c), iron: 0, slag: 0, gas: [], drips: [], flashes: [], gasAcc: 0, capIdx: 0, log: [],
    done: false, oreN: ores.length, feN: feN, kalkN: kalkN };
}
var CAPS = [
  [0.3, 'Unten wird heiße Luft (Heißwind) eingeblasen. Der Koks verbrennt dort mit Sauerstoff zu Kohlenstoffdioxid, dabei entsteht sehr viel Wärme. Deshalb ist es unten am heißesten.'],
  [4, 'Feststoffe wandern im Hochofen kontinuierlich nach unten, die Gase nach oben (Gegenstrom).'],
  [8, 'Das entstandene Kohlenstoffdioxid strömt nach oben und reagiert mit weiterem Kohlenstoff zu Kohlenstoffmonoxid (Boudouard-Gleichgewicht). Der Sauerstoff wurde ein Stockwerk tiefer schon verbraucht, hier fehlt er.'],
  [13, 'Das Kohlenstoffmonoxid steigt weiter nach oben und reagiert mit dem Eisenoxid: Es entsteht festes Eisen.'],
  [19, 'Das Eisen wandert langsam nach unten, bis es in eine Zone kommt, wo es schmilzt. Unten sammelt es sich als flüssiges Roheisen.'],
  [25, 'Der Kalkstein reagiert mit den Verunreinigungen des Erzes (z. B. Silicium) und bildet die Schlacke. Sie schwimmt auf dem flüssigen Roheisen und kann dort abgenommen werden.'],
  [31, 'Das Gas entweicht nach oben durch die Gicht und heißt deshalb Gichtgas. Es enthält neben Stickstoff und Kohlenstoffdioxid auch Kohlenstoffmonoxid, Wasserstoff und Methan.']
];
function pushCap(txt) { S.cap = txt; if (S.run) S.run.log.push(txt); updCap(); }

function fallParts(dt) { var i, p; for (i = 0; i < S.parts.length; i++) { p = S.parts[i]; if (p.fall) { p.vy += 900 * dt; p.y += p.vy * dt; if (p.y >= p.ty) { p.y = p.ty; p.fall = false; } } } }

/* ----- 6 Fazit ----- */
var QZ = [

function pFazit(p) {

var cv = $('cv'), ctx = cv.getContext('2d'), PT = null, lastW = 0;
function toLogical(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * CW, (e.clientY - r.top) / r.height * CH]; }
cv.addEventListener('pointerdown', function (e) { PT = { x: e.clientX, lx: e.clientX, moved: false }; S.auto = false; try { cv.setPointerCapture(e.pointerId); } catch (x) { } });
cv.addEventListener('pointermove', function (e) { if (!PT) return; if (Math.abs(e.clientX - PT.x) > 6) PT.moved = true; if (PT.moved && S.view === 'out' && S.step !== 5) S.yaw += (e.clientX - PT.lx) * 0.012; PT.lx = e.clientX; });
cv.addEventListener('pointerup', function (e) { if (PT && !PT.moved) tap.apply(null, toLogical(e)); PT = null; });

function tap(x, y) {

  if (S.step === 3 && S.run && !S.run.failShown) {
    if (S.view !== 'cut') { showBanner('Wechsle zur Schnittansicht, um die Zonen zu sehen.'); return; }
    var z = id === 'wind' ? zoneById('ver') : (Math.abs(x - CX) <= outerR(clamp(y, 70, 690)) && y >= 70 && y < 610 ? zoneAt(y) : null);
    if (z) { S.selZone = z.id; panel(); }
  }
}
function checkResize() {

  cv.width = Math.round(w * dpr); cv.height = Math.round(w * CH / CW * dpr); VS = w / CW * dpr;
}
var last = performance.now(), prevBell = 0;
function drawSel(c, t) {
  var A = S.aufg, id = A.mode === 'explore' ? A.sel : null, i, h, B = { gicht: [24, 100], schacht: [100, 420], kohlensack: [420, 470], rast: [470, 590], gestell: [590, 716] }, b, pul = 0.6 + 0.4 * Math.sin(t * 6);
  if (S.step !== 1 || !id) return;

  if (B[id]) {
    b = B[id]; var yy0 = b[0], yy1 = b[1], hw = Math.max(outerR(clamp(yy0, 70, 714)), outerR(clamp(yy1, 70, 714))) + 8;
    c.fillStyle = 'rgba(255,209,102,.18)'; c.fillRect(CX - hw, yy0, hw * 2, yy1 - yy0);
    c.setLineDash([8, 6]); c.strokeStyle = 'rgba(255,209,102,' + pul + ')'; c.lineWidth = 3; c.strokeRect(CX - hw, yy0 + 1, hw * 2, yy1 - yy0 - 2);
  } else {
    for (i = 0; i < S.hs.length; i++) { h = S.hs[i]; if (h.id !== id) continue; c.strokeStyle = 'rgba(255,209,102,' + pul + ')'; c.lineWidth = 4; c.beginPath(); c.arc(h.x, h.y, h.r + 6, 0, 6.2832); c.stroke(); c.fillStyle = 'rgba(255,209,102,.2)'; c.fill(); }
  }
  c.setLineDash([]); c.font = 'bold 22px Inter, sans-serif'; c.textAlign = 'left'; var tx = PARTS[id].n, ty = B[id] ? Math.max(B[id][0] + 28, 60) : 40; c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.85)'; c.fillStyle = '#ffd166'; var txx = B[id] ? 14 : 14; c.strokeText(tx, txx, ty); c.fillText(tx, txx, ty);
  c.restore();
}
function frame(now) {

  checkResize(); ctx.setTransform(VS, 0, 0, VS, 0, 0); ctx.clearRect(0, 0, CW, CH); S.hs = [];
  if (S.bell > 0) { S.bell = Math.max(0, S.bell - dt); if (S.bell === 0 && prevBell > 0) panel(); } prevBell = S.bell;
  if (S.auto && S.view === 'out' && S.step !== 5) S.yaw += 0.25 * dt;
  fallParts(dt); simRun(dt); tapStep(dt); konvStep(dt);
  if (S.step === 5) drawKonv(ctx, t, dt); else if (S.view === 'cut') drawCut(ctx, t); else drawOut(ctx, t);
  drawSel(ctx, t);

S = freshState(); panel(); requestAnimationFrame(frame);
