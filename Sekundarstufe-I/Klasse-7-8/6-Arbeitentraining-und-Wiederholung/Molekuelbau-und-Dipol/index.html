<style>
  :root { --bg:#f4f7f6; --ink:#2c3e50; --muted:#6b7a89; --blue:#3498db; --blue-d:#2980b9; --green:#27ae60; --red:#e74c3c; --teal:#1abc9c; --line:#d5dde3; --card:#fff; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',system-ui,-apple-system,Roboto,Tahoma,sans-serif; line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; padding:12px 12px 90px; }

  nav#tabs button { flex:none; border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:14px; font-weight:600; padding:9px 13px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  nav#tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  nav#tabs .cnt { font-weight:500; opacity:.85; margin-left:4px; font-size:12.5px; }
  section.page { display:none; } section.page.on { display:block; }
  h2 { font-size:clamp(19px,4.2vw,23px); margin:14px 0 8px; }
  h3 { font-size:17px; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 15px; margin:12px 0; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .merk { background:#fffbea; border-left:5px solid #f1c40f; }
  .info { background:#e8f8f5; border-left:5px solid var(--teal); }
  .beispiel { background:#eef5fd; border-left:5px solid var(--blue); }
  .merk ul, .info ul, .beispiel ul { margin:6px 0 0; padding-left:20px; } .merk li, .info li { margin:4px 0; }
  .beispiel ol { margin:6px 0 0; padding-left:22px; } .beispiel li { margin:4px 0; }
  .btn { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:11px 16px; font:inherit; font-size:15.5px; font-weight:700; cursor:pointer; }
  .btn:hover { background:var(--blue-d); } .btn:disabled { background:#bdc3c7; cursor:not-allowed; }
  .btn.sec { background:#ecf0f1; color:var(--ink); border:1px solid var(--line); } .btn.sec:hover { background:#e1e7ea; }
  .btn.ok { background:var(--green); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  select, input[type=text] { font:inherit; font-size:16px; padding:7px 8px; border:1.5px solid #b8c4cc; border-radius:7px; background:#fff; color:var(--ink); max-width:100%; }
  input[type=text] { width:5.2em; text-align:center; }

  .task { counter-increment:t; }

  .fb { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:15px; display:none; }

  .tips { margin-top:8px; } .tip { background:#fff8e1; border:1px dashed #f1c40f; border-radius:8px; padding:8px 12px; margin-top:6px; font-size:15px; }
  .loesung { display:none; margin-top:10px; background:#f4f0fb; border-left:5px solid #8e44ad; border-radius:8px; padding:10px 14px; font-size:15px; }
  .loesung.show { display:block; } .loesung p { margin:4px 0; }

  .opts { display:grid; gap:8px; }
  .opt { text-align:left; background:#fff; border:2px solid #cfd8dc; border-radius:9px; padding:10px 12px; font:inherit; font-size:15.5px; color:var(--ink); cursor:pointer; }
  .opt:hover { border-color:var(--blue); } .opt.sel { border-color:var(--blue); background:#eaf4fc; }
  .opt.good { border-color:var(--green); background:#e9f7ef; } .opt.bad { border-color:var(--red); background:#fdecea; }
  .opts.img { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); } .opts.img .opt { text-align:center; }
  .opt svg { max-width:100%; height:auto; }

  .tbl { overflow-x:auto; } table.f { border-collapse:collapse; width:100%; font-size:15.5px; }

  .cl { line-height:2.3; } .cl select { margin:0 3px; } .cl select.good { border-color:var(--green); background:#e9f7ef; } .cl select.bad { border-color:var(--red); background:#fdecea; }
  .m-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .m-row .seg { display:inline-flex; border:1.5px solid #b8c4cc; border-radius:8px; overflow:hidden; } .m-row .seg button { border:0; background:#fff; font:inherit; font-size:14.5px; padding:7px 11px; cursor:pointer; color:var(--ink); }
  .m-row .seg button + button { border-left:1.5px solid #b8c4cc; } .m-row .seg button.sel { background:var(--blue); color:#fff; }
  .m-row.good { background:#f1faf4; } .m-row.bad { background:#fdf0ee; } .m-row .t { flex:1 1 220px; }
  .ordwrap h4 { margin:8px 0 4px; font-size:14px; color:var(--muted); }
  .pool, .seq { display:grid; gap:6px; } .seq { counter-reset:s; min-height:44px; border:2px dashed #cfd8dc; border-radius:9px; padding:6px; }
  .ocard { text-align:left; background:#fff; border:2px solid #cfd8dc; border-radius:9px; padding:8px 11px; font:inherit; font-size:15px; color:var(--ink); cursor:pointer; }
  .seq .ocard { border-color:var(--blue); background:#eaf4fc; } .seq .ocard::before { counter-increment:s; content:counter(s) '. '; font-weight:800; color:var(--blue); }
  .seq .ocard.good { border-color:var(--green); background:#e9f7ef; } .seq .ocard.bad { border-color:var(--red); background:#fdecea; }
  .svgbox { background:#fff; border:1px solid var(--line); border-radius:10px; text-align:center; } .svgbox svg { max-width:100%; height:auto; display:block; margin:0 auto; touch-action:manipulation; }
  .hint { color:var(--muted); font-size:13.5px; margin:6px 0 0; }
  details.en { margin:8px 0; border:1px solid var(--line); border-radius:8px; background:#fafcfd; padding:6px 10px; } details.en summary { cursor:pointer; font-weight:600; font-size:14.5px; }
  table.ent { border-collapse:collapse; margin-top:6px; } table.ent td, table.ent th { border:1px solid var(--line); padding:4px 9px; text-align:center; font-size:14.5px; } table.ent th { background:#eef3f6; }
  .chap { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .chap button { text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px; font:inherit; color:var(--ink); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.05); } .chap button:hover { border-color:var(--blue); } .chap b { display:block; font-size:16.5px; margin-bottom:3px; }
  .pbar { height:8px; background:#e5ebee; border-radius:6px; overflow:hidden; margin-top:6px; } .pbar i { display:block; height:100%; width:0; background:var(--green); transition:width .3s; }
  .check-list { list-style:none; padding:0; margin:6px 0 0; } .check-list li { margin:6px 0; } .check-list label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; } .check-list input { width:20px; height:20px; margin-top:3px; flex:none; }
  .skk-q { border-top:1px solid var(--line); padding:12px 0; } .skk-q:first-child { border-top:0; } .skk-q.good { background:#f1faf4; } .skk-q.bad { background:#fdf0ee; } .skk-q .q { font-weight:600; margin-bottom:6px; }
  .score { font-size:20px; font-weight:800; }
  .impressum { position:fixed; bottom:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; padding:5px 10px; text-decoration:none; border-radius:5px; font-family:sans-serif; font-size:12px; z-index:9999; }
  .lnk { color:var(--blue-d); font-weight:600; }
  @media (max-width:480px) { .card { padding:12px; } }

<script>
'use strict';
/* ================= Hilfsfunktionen ================= */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function mk(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(n, d) { if (d == null) d = 1; return n.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function parseNum(s) { var v = parseFloat(String(s).replace(',', '.').replace(/[^0-9.\-]/g, '')); return isNaN(v) ? null : v; }

var EN = { H: 2.1, C: 2.5, N: 3.0, O: 3.5, F: 4.0, P: 2.1, S: 2.5, Cl: 3.0, Br: 2.8, I: 2.5 };
function dEN(a, b) { return Math.round(Math.abs(EN[a] - EN[b]) * 10) / 10; }
var ATOMFARBE = { H: '#bdc3c7', O: '#e74c3c', N: '#5b8def', Cl: '#2ecc71', F: '#9b59b6', S: '#f1c40f', C: '#7f8c8d', Br: '#a0522d', I: '#8e44ad', P: '#e67e22' };
function atomTxt(s) { return (s === 'H' || s === 'C' || s === 'S' || s === 'P' || s === 'I') ? '#222' : '#fff'; }

function entabelle() {
  var el = ['H', 'C', 'N', 'O', 'F', 'P', 'S', 'Cl', 'Br', 'I'];
  return '<details class="en"><summary>Tabelle der Elektronegativitäten (EN) öffnen</summary><table class="ent"><tr><th>Atom</th>' +
    el.map(function (e) { return '<td><b>' + e + '</b></td>'; }).join('') + '</tr><tr><th>EN</th>' +
    el.map(function (e) { return '<td>' + fmt(EN[e]) + '</td>'; }).join('') + '</tr></table></details>';
}

/* ================= Lewis-Zeichnung ================= */
// slots: [NW, NE, SW, SE]; Werte: 0 leer, 1 freies Paar, 2 H-Atom
var DIRS = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
function lewisSVG(central, slots, opt) {
  opt = opt || {}; var cx = 100, cy = 80, k = 0.7071, s = '';
  s += '<svg viewBox="0 0 200 160" width="' + (opt.w || 200) + '" role="img" aria-label="Lewis-Formel">';
  for (var i = 0; i < 4; i++) {
    var dx = DIRS[i][0] * k, dy = DIRS[i][1] * k, v = slots[i];
    if (v === 2) {
      s += '<line x1="' + (cx + dx * 18) + '" y1="' + (cy + dy * 18) + '" x2="' + (cx + dx * 44) + '" y2="' + (cy + dy * 44) + '" stroke="#34495e" stroke-width="3.5" stroke-linecap="round"/>';
      s += '<circle cx="' + (cx + dx * 60) + '" cy="' + (cy + dy * 60) + '" r="15" fill="' + ATOMFARBE.H + '" stroke="#7f8c8d"/><text x="' + (cx + dx * 60) + '" y="' + (cy + dy * 60 + 6) + '" text-anchor="middle" font-size="17" font-weight="700" fill="#222">H</text>';
    } else if (v === 1) {
      var px = -dy, py = dx, qx = cx + dx * 28, qy = cy + dy * 28;
      s += '<line x1="' + (qx - px * 11) + '" y1="' + (qy - py * 11) + '" x2="' + (qx + px * 11) + '" y2="' + (qy + py * 11) + '" stroke="#d35400" stroke-width="4" stroke-linecap="round"/>';
    } else if (opt.edit) {
      s += '<circle cx="' + (cx + dx * 38) + '" cy="' + (cy + dy * 38) + '" r="13" fill="none" stroke="#b0bec5" stroke-width="2" stroke-dasharray="4 4"/><text x="' + (cx + dx * 38) + '" y="' + (cy + dy * 38 + 6) + '" text-anchor="middle" font-size="18" fill="#b0bec5">+</text>';
    }
    if (opt.edit) s += '<circle class="hit" data-slot="' + i + '" cx="' + (cx + dx * 40) + '" cy="' + (cy + dy * 40) + '" r="26" fill="transparent" style="cursor:pointer"/>';
  }
  s += '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" font-size="30" font-weight="800" fill="' + (central === 'O' ? '#e74c3c' : central === 'Cl' ? '#27ae60' : central === 'N' ? '#3b6fd0' : central === 'F' ? '#8e44ad' : '#b7950b') + '">' + central + '</text>';
  return s + '</svg>';
}

/* ================= Aufgaben-Widgets ================= */
// Jedes Widget liefert { node, check() -> {ok:true|false|null, msg}, solve(), wrong() }
var W = {};

W.mc = function (t) {
  var opts = t.fix ? t.opts.map(function (o) { return o; }) : shuffle(t.opts);
  var sel = -1, node = mk('div', 'opts' + (t.img ? ' img' : '')), btns = [];
  opts.forEach(function (o, i) {
    var b = mk('button', 'opt', o.h); b.type = 'button';
    b.addEventListener('click', function () { sel = i; btns.forEach(function (x, j) { x.className = 'opt' + (j === i ? ' sel' : ''); }); });
    btns.push(b); node.appendChild(b);
  });
  return {
    node: node,
    check: function () {
      if (sel < 0) return { ok: null, msg: 'Wähle zuerst eine Antwort aus.' };
      btns.forEach(function (x, j) { x.className = 'opt' + (j === sel ? (opts[j].ok ? ' good' : ' bad') : ''); });
      return opts[sel].ok ? { ok: true, msg: t.richtig || 'Richtig!' } : { ok: false, msg: opts[sel].fb || 'Das stimmt nicht ganz. Lies die Antworten noch einmal genau.' };
    },
    solve: function () { sel = opts.findIndex(function (o) { return o.ok; }); btns[sel].click(); },
    wrong: function () { sel = opts.findIndex(function (o) { return !o.ok; }); btns[sel].click(); }
  };
};

W.multi = function (t) {
  var node = mk('div'), ans = t.items.map(function () { return null; }), rows = [];
  t.items.forEach(function (it, i) {
    var r = mk('div', 'm-row'), tx = mk('div', 't', it.t), seg = mk('div', 'seg');
    t.cats.forEach(function (c) {
      var b = mk('button', '', c.l); b.type = 'button';
      b.addEventListener('click', function () { ans[i] = c.k; Array.prototype.forEach.call(seg.children, function (x) { x.className = ''; }); b.className = 'sel'; r.className = 'm-row'; });
      seg.appendChild(b);
    });
    r.appendChild(tx); r.appendChild(seg); node.appendChild(r); rows.push(r);
  });
  return {
    node: node,
    check: function () {
      if (ans.some(function (a) { return a === null; })) return { ok: null, msg: 'Entscheide dich bei jeder Zeile.' };
      var bad = [], i;
      for (i = 0; i < ans.length; i++) { var g = ans[i] === t.items[i].a; rows[i].className = 'm-row ' + (g ? 'good' : 'bad'); if (!g) bad.push(i); }
      if (!bad.length) return { ok: true, msg: t.richtig || 'Alles richtig!' };
      return { ok: false, msg: (ans.length - bad.length) + ' von ' + ans.length + ' stimmen. Rot markierte Zeilen noch einmal überlegen.' + (bad.length === 1 && t.items[bad[0]].why ? '<br><b>Hinweis:</b> ' + t.items[bad[0]].why : '') };
    },
    solve: function () { t.items.forEach(function (it, i) { var idx = t.cats.findIndex(function (c) { return c.k === it.a; }); rows[i].querySelectorAll('button')[idx].click(); }); },
    wrong: function () { t.items.forEach(function (it, i) { var idx = t.cats.findIndex(function (c) { return c.k !== it.a; }); rows[i].querySelectorAll('button')[idx].click(); }); }
  };
};

W.form = function (t) {
  var node = mk('div', 'tbl'), tb = '<table class="f"><tr>' + t.cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>', fields = [];
  t.rows.forEach(function (r, ri) {
    tb += '<tr><td><b>' + r.label + '</b></td>';
    r.f.forEach(function (f, fi) {
      tb += '<td data-r="' + ri + '" data-f="' + fi + '">';
      if (f.k === 'num') tb += '<input type="text" inputmode="decimal" autocomplete="off" aria-label="' + esc(r.label) + '">';
      else tb += '<select><option value="">–</option>' + f.opts.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>';
      tb += '</td>';
    });
    tb += '</tr>';
  });
  node.innerHTML = tb + '</table>';
  var tds = node.querySelectorAll('td[data-r]');
  Array.prototype.forEach.call(tds, function (td) { var r = +td.getAttribute('data-r'), f = +td.getAttribute('data-f'); fields.push({ td: td, f: t.rows[r].f[f], el: td.firstChild }); });
  function clear() { fields.forEach(function (x) { x.td.className = ''; }); }
  node.addEventListener('input', clear); node.addEventListener('change', clear);
  return {
    node: node,
    check: function () {
      var empty = fields.some(function (x) { return x.el.value === ''; });
      if (empty) return { ok: null, msg: 'Fülle zuerst alle Felder aus.' };
      var good = 0;
      fields.forEach(function (x) {
        var ok = x.f.k === 'num' ? (parseNum(x.el.value) !== null && Math.abs(parseNum(x.el.value) - x.f.ans) <= (x.f.tol || 0.05)) : x.el.value === x.f.ans;
        x.td.className = ok ? 'good' : 'bad'; if (ok) good++;
      });
      return good === fields.length ? { ok: true, msg: t.richtig || 'Alles richtig!' } : { ok: false, msg: good + ' von ' + fields.length + ' Feldern sind richtig. Die roten Felder noch einmal prüfen.' };
    },
    solve: function () { fields.forEach(function (x) { x.el.value = x.f.k === 'num' ? fmt(x.f.ans, x.f.dec == null ? 1 : x.f.dec) : x.f.ans; }); },
    wrong: function () { fields.forEach(function (x) { x.el.value = x.f.k === 'num' ? '9,9' : x.f.opts.filter(function (o) { return o !== x.f.ans; })[0]; }); }
  };
};

W.cloze = function (t) {
  var node = mk('div', 'cl'), sels = [], html = esc(t.text).replace(/\[\[(.+?)\]\]/g, function (m, g) { return '<select>' + '<option value="">–</option>' + g.split('|').map(function (o) { return '<option value="' + (o.slice(-1) === '*' ? '1' : '0') + '">' + o.replace('*', '') + '</option>'; }).join('') + '</select>'; });
  node.innerHTML = html; sels = Array.prototype.slice.call(node.querySelectorAll('select'));
  sels.forEach(function (s) { s.addEventListener('change', function () { s.className = ''; }); });
  return {
    node: node,
    check: function () {
      if (sels.some(function (s) { return s.value === ''; })) return { ok: null, msg: 'Fülle zuerst alle Lücken aus.' };
      var good = 0; sels.forEach(function (s) { var ok = s.value === '1'; s.className = ok ? 'good' : 'bad'; if (ok) good++; });
      return good === sels.length ? { ok: true, msg: t.richtig || 'Der ganze Text stimmt!' } : { ok: false, msg: good + ' von ' + sels.length + ' Lücken sind richtig. Prüfe die roten noch einmal.' };
    },
    solve: function () { sels.forEach(function (s) { s.value = '1'; }); },
    wrong: function () { sels.forEach(function (s) { s.value = '0'; }); }
  };
};

W.order = function (t) {
  var node = mk('div', 'ordwrap'), n = t.items.length, seq = [], pool;
  var cards = t.items.map(function (h, i) { return { h: h, i: i }; });
  do { pool = shuffle(cards); } while (pool.every(function (c, i) { return c.i === i; }) && n > 1);
  var seqEl = mk('div', 'seq'), poolEl = mk('div', 'pool');
  node.appendChild(mk('h4', '', 'Deine Reihenfolge (zum Entfernen antippen):')); node.appendChild(seqEl);
  node.appendChild(mk('h4', '', 'Karten (zum Anfügen antippen):')); node.appendChild(poolEl);
  function draw(marks) {
    seqEl.innerHTML = ''; poolEl.innerHTML = '';

/* ================= Kapitel zusammenbauen ================= */
function buildChapter(k) {

}

  { k: '3', t: 'Was ist die Voraussetzung für eine Wasserstoffbrücke?', o: ['Zwei Atome mit gleicher Elektronegativität', 'Ein H-Atom (δ+) an F, O oder N und ein freies Elektronenpaar an F, O oder N eines anderen Moleküls', 'Ein Ion und ein Molekül', 'Nur unpolare Atombindungen'], a: 1, e: 'δ+ am H (gebunden an F, O oder N) wird von einem freien Elektronenpaar (δ−) eines anderen Moleküls angezogen.' },

function buildSKK() {
  var sec = mk('section', 'page'); sec.id = 'pcheck';
  var intro = mk('div', 'card info', '<h3>SKK-Check</h3><p style="margin:4px 0">12 Fragen wie in der Kontrolle, <b>ohne Tipps</b>. Beantworte alle und klicke dann auf „Auswerten“. Danach siehst du zu jeder Frage die Erklärung und weißt, welches Kapitel du wiederholen solltest.</p>');
  var list = mk('div', 'card'), res = mk('div', 'card'); res.style.display = 'none';
  var row = mk('div', 'row'), bEval = mk('button', 'btn ok', 'Auswerten'), bNew = mk('button', 'btn sec', 'Neu mischen'); bEval.type = bNew.type = 'button'; row.appendChild(bEval); row.appendChild(bNew);
  sec.appendChild(intro); sec.appendChild(list); sec.appendChild(row); sec.appendChild(res);
  var st = [], evaluated = false;
  function render() {
    list.innerHTML = ''; res.style.display = 'none'; evaluated = false; st = [];
    shuffle(SKK.map(function (q, i) { return i; })).forEach(function (qi, n) {
      var q = SKK[qi], d = mk('div', 'skk-q'), s = { q: q, sel: -1, el: d, val: '' };
      d.innerHTML = '<div class="q">' + (n + 1) + '. ' + q.t + '</div>';

        os.forEach(function (x, i) { var b = mk('button', 'opt', x.o); b.type = 'button'; b.addEventListener('click', function () { if (evaluated) return; s.sel = i; s.btns.forEach(function (y, j) { y.className = 'opt' + (j === i ? ' sel' : ''); }); }); s.btns.push(b); wrap.appendChild(b); });
        d.appendChild(wrap);
      } else {
        var inp = mk('input'); inp.type = 'text'; inp.setAttribute('inputmode', 'decimal'); inp.setAttribute('autocomplete', 'off'); inp.setAttribute('aria-label', 'ΔEN'); d.appendChild(inp); s.inp = inp;

    res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

}

/* ================= Merkzettel ================= */
function buildMerk() {
  var sec = mk('section', 'page'); sec.id = 'pmerk';
  sec.innerHTML = '<h2>Merkzettel</h2>' +
    '<div class="card merk"><h3>1 · Molekülbau</h3><ul><li>Hauptgruppennummer = Zahl der Außenelektronen (O: 6, H: 1).</li><li>Ziel: volle Außenschale (H: 2, O: 8). Dafür teilen Atome Elektronenpaare: Elektronenpaarbindung.</li><li>H₂O: 2 bindende und 2 freie Elektronenpaare am Sauerstoff.</li><li>Lewis-Formel: Strich zwischen Atomen = bindendes, Strich am Atom = freies Elektronenpaar.</li></ul></div>' +
    '<div class="card merk"><h3>2 · Elektronegativität und Polarität</h3><ul><li><b>ΔEN = EN(größer) − EN(kleiner)</b></li><li>ΔEN &lt; 0,6 → <b>unpolar</b> · ΔEN ≥ 0,6 → <b>polar</b></li><li>Polar: δ− am Atom mit der größeren EN, δ+ am anderen. Das Molekül ist insgesamt neutral.</li><li>H₂O: ΔEN(O–H) = 3,5 − 2,1 = 1,4 → polar, Dipol.</li></ul></div>' +
    '<div class="card merk"><h3>3 · Wasserstoffbrücken und Siedepunkt</h3><ul><li>Wasserstoffbrücke: δ+ H (an F, O oder N) ··· freies Elektronenpaar (F, O, N) eines <i>anderen</i> Moleküls.</li><li>Zwischen den Molekülen, schwächer als Atombindungen.</li><li>Sieden: Wasserstoffbrücken werden gelöst, die Moleküle bleiben heil.</li><li>Mehr Wasserstoffbrücken → mehr Energie → höherer Siedepunkt (H₂O: 100 °C, H₂S: −60 °C).</li></ul></div>' +
    '<div class="card merk"><h3>4 · Polarität und Löslichkeit</h3><ul><li><b>Gleiches löst sich in Gleichem.</b></li><li>Polare Stoffe (Dipole) lösen sich in polaren Lösungsmitteln wie Wasser.</li><li>Unpolare Stoffe (Öl, Fett, Benzin, Iod) lösen sich nicht in Wasser, aber in unpolaren Lösungsmitteln wie Benzin.</li><li>Grund: Wasser-Dipole ziehen sich mit Wasserstoffbrücken untereinander an. Unpolare Teilchen haben keine Teilladungen und werden verdrängt.</li></ul></div>' +
    '<div class="card"><h3>Das kann ich</h3><ul class="check-list">' +
    ['die Lewis-Formel von H₂O zeichnen und erklären (bindende und freie Elektronenpaare)', 'ΔEN berechnen und mit der Grenze 0,6 die Bindungsart bestimmen', 'bei einer polaren Bindung δ+ und δ− richtig setzen', 'erklären, warum das Wassermolekül ein Dipol ist', 'sagen, wann Wasserstoffbrücken entstehen, und sie zeichnen (gestrichelt)', 'den Unterschied zwischen Atombindung und Wasserstoffbrücke erklären', 'den hohen Siedepunkt von Wasser mit Wasserstoffbrücken begründen', 'vorhersagen, ob sich ein Stoff in Wasser oder in Benzin löst, und das mit Polarität begründen'].map(function (x) { return '<li><label><input type="checkbox"><span>' + x + '</span></label></li>'; }).join('') + '</ul></div>';
  return sec;
}
