      display: block;
      border-radius: 12px; /* Leicht abgerundete Ecken für den Hover-Effekt */
      transition: background-color 0.2s ease;
    }
    
    /* Leichter weißer Schleier, wenn man mit der Maus über das Objekt fährt */

      background-color: rgba(255, 255, 255, 0.35); 
      cursor: pointer;
    }

    /* Prozentuale Positionierung der einzelnen Gegenstände */
