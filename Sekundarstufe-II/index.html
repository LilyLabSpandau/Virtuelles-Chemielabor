<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sekundarstufe II - Chemie</title>
  <style>
    /* Reset: Außenabstände entfernen und Scrollen verhindern, für echten Vollbild-Look */
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      font-family: system-ui, sans-serif; 
      background-color: #0f172a; 
      overflow: hidden; 
    }

    /* Schwebende Info-Box (Text und Buttons) oben links */
    .info-box {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85); /* Leicht transparentes Weiß */
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      backdrop-filter: blur(5px); /* Moderner Milchglas-Effekt */
      max-width: 320px;
    }

    .nav-btn { 
      display: inline-block; 
      margin-bottom: 12px; 
      color: #b91c1c; 
      text-decoration: none; 
      font-weight: 600;
    }
    
    .nav-btn:hover { text-decoration: underline; }
    
    h1 { 
      margin: 0 0 10px 0;
      font-size: 1.4rem;
      border-bottom: 3px solid #b91c1c; 
      padding-bottom: 10px; 
      color: #b91c1c; 
    }
    
    p { margin: 0; color: #333; font-size: 0.95rem; line-height: 1.4; }

    /* Der äußere Container spannt sich über den ganzen Bildschirm */
    .fullscreen-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Der Trick: Dieser Wrapper behält immer exakt das 16:9 Format des Bildes. 
       Er skaliert dynamisch mit, sodass keine weißen Ränder entstehen,
       die klickbaren Zonen aber 100% passgenau bleiben! */
    .image-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio (9 geteilt durch 16) */
      min-height: 100vh;
      min-width: 177.77vh; /* Umkehrmaß für 16:9 (16 geteilt durch 9) */
      flex-shrink: 0;
    }
    
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Klickbare Zonen */
    .click-area {
      position: absolute;
      display: block;
      border-radius: 12px;
      transition: background-color 0.2s ease;
      z-index: 5;
    }
    
    /* Hover-Effekt: Zeigt einen weißen Schleier an, wenn man über das Objekt fährt */
    .click-area:hover {
      background-color: rgba(255, 255, 255, 0.3); 
      cursor: pointer;
    }

    /* Prozentuale Positionen (exakt auf das Bild abgestimmt) */
    .area-q1 { top: 22%; left: 35%; width: 14%; height: 26%; } /* Modell */
    .area-q2 { top: 16%; left: 56%; width: 12%; height: 32%; } /* Brenner */
    .area-q3 { top: 52%; left: 35%; width: 14%; height: 22%; } /* Zitrone */
    .area-q4 { top: 54%; left: 55%; width: 14%; height: 20%; } /* Batterie */

  </style>
</head>
<body>

  <!-- Das UI (Menü und Text) liegt dank "position: absolute" über dem Bild -->
  <div class="info-box">
    <a href="../index.html" class="nav-btn">← Zurück zur Übersicht</a>
    <h1>Sekundarstufe II</h1>
    <p>Wähle ein Semester aus, indem du auf den entsprechenden Gegenstand klickst.</p>
  </div>

  <!-- Das Vollbild mit den Verlinkungen -->
  <div class="fullscreen-container">
    <div class="image-wrapper">
      <img src="Sek II.jpg" alt="Chemie Labor Tisch mit Gegenständen für Q1 bis Q4">
      
      <!-- Klickbare Zonen -->
      <a href="./Q1-Naturliche-und-synthetische-makromolekulare-Stoffe/index.html" class="click-area area-q1" title="Q1: Makromolekulare Stoffe"></a>
      <a href="./Q2-Verlauf-chemischer-Reaktionen/index.html" class="click-area area-q2" title="Q2: Verlauf chemischer Reaktionen"></a>
      <a href="./Q3-Das-Donator-Akzeptor-Prinzip/index.html" class="click-area area-q3" title="Q3: Donator-Akzeptor-Prinzip"></a>
      <a href="./Q4-Elektrische-Energie-aus-chemischen-Reaktionen/index.html" class="click-area area-q4" title="Q4: Elektrische Energie"></a>
    </div>
  </div>

</body>
</html>
