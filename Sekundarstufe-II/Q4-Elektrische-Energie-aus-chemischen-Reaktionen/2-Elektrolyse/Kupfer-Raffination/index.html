  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, by + bh - 20); c.quadraticCurveTo(bx, by + bh, bx + 20, by + bh); c.lineTo(bx + bw - 20, by + bh); c.quadraticCurveTo(bx + bw, by + bh, bx + bw, by + bh - 20); c.lineTo(bx + bw, by); c.stroke();

  txt(c, 'Gleichstrom', 300, 72, 12, '#c9b9ad'); txt(c, R.cur ? (R.cur === 1 ? 'schwach' : R.cur === 2 ? 'mittel' : 'stark') : 'AUS', 300, 92, 15, R.cur ? '#ffd166' : '#8b8b99', 'center', true);

    while (k < 4 && s > len[k]) { s -= len[k]; k++; } var u = s / len[k]; x = lerp(path[k][0], path[k + 1][0], u); y = lerp(path[k][1], path[k + 1][1], u);
    if (x > 235 && x < 365 && y === 80) return; c.fillStyle = '#ffe14a'; c.shadowColor = '#ffe14a'; c.shadowBlur = 8; c.beginPath(); c.arc(x, y, 4.5, 0, 6.283); c.fill(); c.shadowBlur = 0;
  });
  txt(c, 'Anode (+)', AX, 175, 14, '#ff9d9d', 'center', true); txt(c, 'Rohkupfer', AX, 191, 11.5, '#c9b9ad');

}

var RQS = [
  { q: 'An welcher Elektrode findet die <b>Oxidation</b> statt?', o: ['An der Anode (Pluspol): Cu → Cu²⁺ + 2 e⁻', 'An der Kathode (Minuspol): Cu²⁺ + 2 e⁻ → Cu', 'An beiden Elektroden', 'An keiner – es ist keine Redoxreaktion'], a: 0, w: 'Oxidation = Elektronen-Abgabe. Das Rohkupfer gibt Elektronen ab und geht als Cu²⁺ in Lösung. Die Elektronen fließen über das Netzgerät zur Kathode.' },
  { q: 'Warum findet man <b>Silber und Gold</b> am Ende im Anodenschlamm?', o: ['Sie sind edler als Kupfer und werden bei dieser Spannung nicht oxidiert', 'Sie sind unedler als Kupfer und lösen sich zuerst', 'Sie sind schwerer löslich, weil sie Salze bilden', 'Sie wandern zur Kathode'], a: 0, w: 'Edle Metalle geben ihre Elektronen schlechter ab als Kupfer. Sie bleiben als Metall zurück und fallen zu Boden – ein wertvolles Nebenprodukt.' },

  { q: 'Warum bleibt die Konzentration der Cu²⁺-Ionen in der Lösung ungefähr gleich?', o: ['An der Anode entsteht genauso viel Cu²⁺, wie an der Kathode verbraucht wird', 'Weil Kupfer nicht reagiert', 'Weil Wasser nachfließt', 'Weil die Lösung gerührt wird'], a: 0, w: 'Pro 2 abgegebene Elektronen löst sich 1 Cu an der Anode, pro 2 aufgenommene Elektronen scheidet sich 1 Cu an der Kathode ab.' }
];

/* ====== Zustand ====== */
var S = { step: 1, done: {}, t: 0 };
var STEPN = ['1 · Elektrolysezelle', '2 · Wer löst sich?', '3 · Check'];
function markDone(n) { if (!S.done[n]) { S.done[n] = true; renderSteps(); } }
var RQ = { n: 0 };

/* ====== Tab 1 ====== */
function p1panel(p) {
  p.appendChild(mk('h2', '', '🔌 Elektrolyse: Kupfer reinigen'));
  p.appendChild(mk('p', 'muted', 'Bei der Elektrolyse <b>erzwingt</b> eine äußere Spannungsquelle eine Redoxreaktion, die von selbst nicht abläuft. Technisch nutzt man das, um Rohkupfer (ca. 99 %) auf 99,99 % zu reinigen – nötig für elektrische Leitungen. Schalte den Strom ein und beobachte.'));
  var r = mk('div', 'row');
  [[0, '⏹ Aus'], [1, '⚡ schwach'], [2, '⚡⚡ mittel'], [3, '⚡⚡⚡ stark']].forEach(function (q) { r.appendChild(btn(q[1], 'sec small' + (RF.cur === q[0] ? ' on' : ''), function () { RF.cur = q[0]; panel(); })); });
  r.appendChild(btn('↺ Neu', 'sec small', function () { var c = RF.cur; rfNew(); RF.cur = c; panel(); }));
  p.appendChild(r);
  p.appendChild(mk('div', 'cap', '<small>Halbgleichungen</small><b>Anode (+):</b> Cu → Cu²⁺ + 2 e⁻ &nbsp;(Oxidation)<br><b>Kathode (−):</b> Cu²⁺ + 2 e⁻ → Cu &nbsp;(Reduktion)<br><small style="text-transform:none;letter-spacing:0">Elektronen fließen über die Spannungsquelle von der Anode zur Kathode.</small>'));
  p.appendChild(mk('div', 'legend', '<span><i style="background:#7cc4ff"></i>Cu²⁺-Ionen</span> <span><i style="background:#e8ecf4"></i>Silber</span> <span><i style="background:#ffd24a"></i>Gold</span> <span><i style="background:#c8ffc8"></i>Zn²⁺/Fe²⁺ (bleiben gelöst)</span>'));
  p.appendChild(mk('h3', '', 'Aufgaben (' + RQ.n + '/' + RQS.length + ')'));
  if (RQ.n >= RQS.length) {
    markDone(1); p.appendChild(mk('div', 'fb ok', '<b>🏆 Zelle verstanden!</b>')); var nr = mk('div', 'row'); nr.appendChild(btn('Weiter: Wer löst sich? →', 'go', function () { goStep(2); })); p.appendChild(nr);
  } else {
    var Q = RQS[RQ.n], qb = mk('div'); qb.appendChild(mk('p', '', '<b>' + Q.q + '</b>')); mcq(qb, Q.o, Q.a, function (ok) { if (ok) setTimeout(function () { RQ.n++; panel(); }, 1100); }, Q.w); p.appendChild(qb);
  }
}

/* ====== Tab 2: Verunreinigungen ====== */
var IMP = [
  { id: 'Zn', n: 'Zink', a: 0, w: 'Zink ist <b>unedler</b> als Kupfer (Redoxreihe!). Es gibt Elektronen leichter ab und geht als Zn²⁺ in Lösung. An der Kathode wird bevorzugt das edlere Cu²⁺ reduziert – Zn²⁺ bleibt gelöst.' },
  { id: 'Fe', n: 'Eisen', a: 0, w: 'Eisen ist unedler als Kupfer: Fe → Fe²⁺ + 2 e⁻. Die Ionen bleiben in der Lösung.' },
  { id: 'Ni', n: 'Nickel', a: 0, w: 'Nickel ist unedler als Kupfer und geht als Ni²⁺ in Lösung.' },
  { id: 'Ag', n: 'Silber', a: 1, w: 'Silber ist <b>edler</b> als Kupfer. Es wird bei dieser geringen Spannung nicht oxidiert und fällt als Metall ab: Anodenschlamm.' },
  { id: 'Au', n: 'Gold', a: 1, w: 'Gold ist so edel, dass es als Metall im Anodenschlamm landet – ein wertvolles Nebenprodukt.' },
  { id: 'Pt', n: 'Platin', a: 1, w: 'Platin ist sehr edel und bleibt als Metall im Anodenschlamm.' }

var IM = { order: null, i: 0, ok: {}, first: 0, tried: false, fb: '' };

    c.fillStyle = cu ? '#ff8a3d' : '#555a66'; c.beginPath(); c.arc(106, y, 15, 0, 6.283); c.fill(); txt(c, id, 106, y + 1, 14, '#10101a', 'center', true);
    txt(c, names[id] + (cu ? '  (Hauptbestandteil der Anode)' : ''), 130, y + 1, 15, '#f6eee8', 'left', true);

  });

function p2panel(p) {

      var b = mk('button', '', '<b>' + o[0] + '</b>'); b.type = 'button';
      b.addEventListener('click', function () {
        if (k === q.a) { IM.ok[q.id] = 1; if (!IM.tried) IM.first++; IM.tried = false; IM.fb = '<div class="fb ok"><b>✔ ' + q.n + ':</b> ' + q.w + '</div>'; IM.i++; burst($('panel')); }
        else { IM.tried = true; IM.fb = '<div class="fb no">Nicht ganz. Vergleiche ' + q.n + ' mit Kupfer in der Redoxreihe: Wer gibt Elektronen leichter ab?</div>'; }
        panel();
      }); box.appendChild(b);

/* ====== Tab 3: Check ====== */
var CHK = [

  { q: 'Welche Elektrode ist bei der Elektrolyse der Pluspol und wo findet die Oxidation statt?', o: ['Anode – Oxidation', 'Kathode – Oxidation', 'Anode – Reduktion', 'Kathode – Reduktion'], a: 0, w: 'Anode = Pluspol = Oxidation (Elektronen-Abgabe). Kathode = Minuspol = Reduktion.' },
  { q: 'Reines Kupfer scheidet sich ab an der …', o: ['Kathode (Minuspol) durch Reduktion von Cu²⁺', 'Anode (Pluspol) durch Reduktion von Cu²⁺', 'Anode durch Oxidation von Cu', 'Kathode durch Oxidation von Cu'], a: 0, w: 'Cu²⁺ + 2 e⁻ → Cu: Elektronen-Aufnahme = Reduktion, am Minuspol.' },

  { q: 'Zink im Rohkupfer wird …', o: ['oxidiert und bleibt als Zn²⁺ in Lösung', 'an der Kathode abgeschieden', 'zu Anodenschlamm', 'reduziert'], a: 0, w: 'Zn ist unedler als Cu, geht als Zn²⁺ in Lösung; an der Kathode wird bevorzugt Cu²⁺ reduziert.' }

    var r = mk('div', 'row'); r.appendChild(btn('Check wiederholen', 'sec', function () { CK.list = null; panel(); })); r.appendChild(btn('Zurück zur Übersicht', 'go', function () { location.href = '../index.html'; })); p.appendChild(r); return;
  }
  p.appendChild(mk('div', 'prog', '<i style="width:' + (CK.i / CK.list.length * 100) + '%"></i>'));
  var Q = CK.list[CK.i], first = true;
  p.appendChild(mk('h3', '', 'Frage ' + (CK.i + 1) + ' / ' + CK.list.length)); p.appendChild(mk('p', '', '<b>' + Q.q + '</b>'));
  mcq(p, Q.o, Q.a, function (ok) { if (!ok) { first = false; return; } if (first) CK.ok++; setTimeout(function () { CK.i++; if (CK.i >= CK.list.length) CK.done = true; panel(); if (CK.done) burst($('panel')); }, 1300); }, Q.w);
}

function renderSteps() { var n = $('steps'); n.innerHTML = ''; STEPN.forEach(function (nm, i) { var b = mk('button', (S.step === i + 1 ? 'on ' : '') + (S.done[i + 1] ? 'done' : ''), nm); b.type = 'button'; b.addEventListener('click', function () { goStep(i + 1); }); n.appendChild(b); }); }
function goStep(n) { S.step = n; panel(); window.scrollTo(0, 0); }
function panel() { var p = $('panel'); p.innerHTML = ''; renderSteps(); $('legend').innerHTML = ''; if (S.step === 1) p1panel(p); else if (S.step === 2) p2panel(p); else p3panel(p); }
rfNew(); RF.cur = 1;
var last = performance.now();
function frame(now) { var dt = Math.min(.05, (now - last) / 1000); last = now; S.t += dt; g.setTransform(2, 0, 0, 2, 0, 0); if (S.step === 1) { rfStep(dt); rfDraw(); } else impDraw(); requestAnimationFrame(frame); }
panel(); requestAnimationFrame(frame);
