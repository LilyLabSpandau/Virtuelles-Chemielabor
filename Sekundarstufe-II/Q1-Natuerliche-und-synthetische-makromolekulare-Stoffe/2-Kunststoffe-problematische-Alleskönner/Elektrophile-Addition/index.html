 {label:'Bromonium-Ion',short:'Ionenbildung',title:'Bildung des Bromonium-Ions',duration:9300,text:'Ein Paar aus der Doppelbindung und ein freies Paar des nahen Br-Atoms bilden zwei C–Br-Bindungen. Bei der gleichzeitigen <strong>heterolytischen Bindungsspaltung</strong> erhält das fernere Br-Atom das gesamte Paar der Br–Br-Bindung und wird zum Bromid-Ion. Jeder gekrümmte <strong>Elektronenpaarpfeil</strong> zeigt, wo ein Paar startet und wohin es gelangt. Der positiv geladene Dreiring heißt <strong>Bromonium-Ion</strong> und ist ein Zwischenprodukt.'},
 {label:'Rückseitenangriff',short:'Angriff',title:'Nukleophiler Rückseitenangriff',duration:11300,text:'Das Bromid-Ion ist jetzt das <strong>Nukleophil</strong>. Es nähert sich einem C-Atom von der Seite, die der Brombrücke gegenüberliegt, und stellt ein freies Elektronenpaar für eine neue C–Br-Bindung bereit. Bei diesem <strong>nukleophilen Angriff</strong> geht das Elektronenpaar der Bindung zwischen diesem C-Atom und dem Brückenatom auf das Brückenatom über. Der Ring öffnet sich.'},
 {label:'Produktbildung',short:'Produkt',title:'1,2-Dibromethan',duration:4400,text:'An jedem C-Atom sitzt jetzt ein Br-Atom. Zwischen den beiden C-Atomen liegt eine Einfachbindung vor, und alle Atome sind formal ungeladen. Die beiden hervorgehobenen C–Br-Bindungen zeigen, an welchen Stellen Brom an das Ethen addiert wurde.'}

const q=s=>document.querySelector(s), clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t;

function state(){

const kinds=[0,0,1,1,1,1,2,2];
function draw3(s){

 const extent=axis=>[Math.min(...points.map((p,i)=>p[axis]-materials[kinds[i]].r)),Math.max(...points.map((p,i)=>p[axis]+materials[kinds[i]].r))];

 const top=mix(-44,-7,s.near);
 const bounds=step<2?`91 ${top} 348 ${211-top}`:step===2?'105 16 352 225':'102 43 295 199';
 // Fit both reactants with a fixed frame across each electron transfer.
 q('#scheme').setAttribute('viewBox',bounds);
 q('#scheme').innerHTML='<defs><marker id="tip" viewBox="0 0 10 9" refX="9" refY="4.5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 4.5 0 9 2.5 4.5Z" fill="#2775aa"/></marker></defs>'+ink+labels+'<g opacity="'+s.arrow+'">'+arrows+'</g>';
}
const steps=q('.steps');
stages.forEach((x,i)=>{
 const btn=document.createElement('button');btn.className='step';btn.innerHTML='<span>'+ (i+1)+'</span><b class="wide" style="font-weight:inherit">'+x.label+'</b><em class="mobile">'+x.short+'</em>';btn.setAttribute('aria-label','Schritt '+(i+1)+': '+x.title);
 btn.onclick=()=>select(i);steps.append(btn);
});
function setDetails(){
 [...steps.children].forEach((b,i)=>i===step?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));
 q('#counter').textContent='Schritt '+(step+1)+' von 4';
 q('#stepTitle').textContent=stages[step].title;q('#explanation').innerHTML=stages[step].text;
 q('#arrowKey').textContent=step===1||step===2?'↷ Elektronenpaarverschiebung':step===3?'Grün · neue C–Br-Bindungen':'';
 q('#scheme').setAttribute('aria-label',stages[step].title+'. '+q('#explanation').textContent);
 q('#next').textContent=step===3?'Gesamtablauf ↻':'Weiter →';
}
function controls(){
 q('#play').textContent=playing?'Ⅱ Pause':t>=1?'▶ Abspielen':'▶ Start';
 q('#play').setAttribute('aria-label',playing?'Animation pausieren':'Animation abspielen');
 q('#status').textContent=whole?'Gesamtablauf':t>=1?'Schritt beendet':'';
}
function render(){
 const s=state();draw3(s);draw2(s);q('#time').value=Math.round(t*1000);q('#time').setAttribute('aria-valuetext',Math.round(t*100)+' Prozent');
}
function tick(now){
 if(!playing)return;
 if(previous)t=Math.min(1,t+(now-previous)/stages[step].duration);
 previous=now;render();
 if(t===1){
  if(whole&&step<3){step++;t=0;setDetails();controls()}
  else{playing=false;whole=false;controls();return}
 }
 frame=requestAnimationFrame(tick);
}
function run(){cancelAnimationFrame(frame);playing=true;previous=0;controls();frame=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(frame);controls()}
function select(i,all=false){step=i;t=0;whole=all;setDetails();render();run()}
q('#play').onclick=()=>{if(playing){pause();return}if(t===1)t=0;run()};
q('#repeat').onclick=()=>select(step);
q('#next').onclick=()=>step===3?select(0,true):select(step+1);
q('#time').oninput=e=>{whole=false;pause();t=+e.target.value/1000;render();controls()};
function resetView(){yaw=baseYaw;pitch=basePitch;draw3(state())}
q('#home').onclick=resetView;
q('#home').onpointerup=e=>{if(e.pointerType==='touch')resetView()};
let drag=null;
canvas.onpointerdown=e=>{if(drag)return;drag=[e.pointerId,e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag||e.pointerId!==drag[0])return;yaw+=(e.clientX-drag[1])*.012;pitch=clamp(pitch+(e.clientY-drag[2])*.012,-1.48,1.48);drag=[e.pointerId,e.clientX,e.clientY];draw3(state())};
canvas.onlostpointercapture=canvas.onpointercancel=canvas.onpointerup=()=>{drag=null};
canvas.onkeydown=e=>{const move={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.15],ArrowDown:[0,.15]}[e.key];if(move){e.preventDefault();yaw+=move[0];pitch=clamp(pitch+move[1],-1.48,1.48);draw3(state())}};
window.addEventListener('resize',()=>draw3(state()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
setDetails();render();if(matchMedia('(prefers-reduced-motion: reduce)').matches){controls()}else{run()}
</script></body></html>
