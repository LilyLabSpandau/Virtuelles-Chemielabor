<script>
'use strict';
/* ====== Helfer ====== */
function $(id) { return document.getElementById(id); }
function mk(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function btn(label, cls, fn, dis) { var b = mk('button', 'btn ' + (cls || ''), label); b.type = 'button'; if (dis) b.disabled = true; b.addEventListener('click', fn); return b; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function burst(host) {
  var r = host.getBoundingClientRect(), b = mk('div', 'burst'), i, p;
  b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top + Math.min(r.height / 2, 200)) + 'px';
  for (i = 0; i < 18; i++) { p = mk('i'); p.style.background = ['#7df9ff', '#8b5cff', '#5ee6a8', '#ffd166'][i % 4]; p.style.setProperty('--dx', Math.round(rnd(-120, 120)) + 'px'); p.style.setProperty('--dy', Math.round(rnd(-120, 60)) + 'px'); b.appendChild(p); }
  document.body.appendChild(b); setTimeout(function () { b.remove(); }, 1000);
}
/* Mehrfachauswahl: opts[0] ist richtig, die Anzeige wird gemischt */
function mcq(host, opts, onOk) {
  var box = mk('div', 'opts'), done = false;
  shuffle(opts.map(function (t, i) { return { t: t, ok: i === 0 }; })).forEach(function (o) {
    var b = mk('button', 'opt', o.t); b.type = 'button';
    b.addEventListener('click', function () {
      if (done) return;
      if (o.ok) { done = true; b.className = 'opt good'; burst(b); if (onOk) onOk(); } else { b.className = 'opt bad'; }
    });
    box.appendChild(b);
  });
  host.appendChild(box); return box;
}
function numQ(host, o, onOk) {
  var row = mk('div', 'row'), inp = mk('input', 'num'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = o.ph || 'Ergebnis'; inp.setAttribute('aria-label', 'Ergebnis');
  var fb = mk('div'), done = false;
  row.appendChild(inp); row.appendChild(mk('span', 'muted', o.unit));
  row.appendChild(btn('Prüfen', 'small', function () {
    if (done) return;
    var v = parseFloat(String(inp.value).replace(',', '.'));
    if (isNaN(v)) { fb.className = 'fb info'; fb.textContent = 'Gib eine Zahl ein.'; return; }
    if (Math.abs(v - o.ans) <= Math.abs(o.ans) * (o.tol || 0.03)) { done = true; fb.className = 'fb ok'; fb.innerHTML = '✔ Richtig. ' + (o.ok || ''); burst(row); if (onOk) onOk(); }
    else { fb.className = 'fb no'; fb.textContent = 'Das stimmt noch nicht. Prüfe Formel, Einheiten und Zehnerpotenzen.'; }
  }));
  host.appendChild(row); host.appendChild(fb);
}

/* ====== Physik der Simulation ====== */
var ZM = 13, YM = 4.5, XS = -17, XP = 0, XE = 17, SLZ = 1.5, DA = 5; /* Schirmhalbbreite, Schirmhalbhöhe, Quelle, Platte, Schirm, Spaltposition (±), Verhältnis Spaltabstand/Spaltbreite */
var S = { bh: {}, bs: 0, snapped: {}, wdone: false, wa: 0, step: 1, unlocked: 1, src: 'e', slits: 'AB', det: false, U: 200, lam: 550, N: 0, run: false, acc: 0, hits: {}, ti: 0, tdone: {}, tprog: {}, cls: {}, fz: {}, fx: {} };
var CFG = { e: { name: 'Elektronen' }, p: { name: 'Photonen' } };
function period() { return S.src === 'e' ? 1.6 * Math.sqrt(200 / S.U) : S.src === 'p' ? 1.6 * S.lam / 550 : 1.6; }
function gauss() { return (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.7; }
function sampleK() { var sl = S.slits === 'A' ? -1 : S.slits === 'B' ? 1 : (Math.random() < 0.5 ? -1 : 1); return { slit: sl, z: clamp(sl * 3.0 + gauss() * 0.55, -ZM + 0.3, ZM - 0.3) }; }
function sinc2(x) { if (Math.abs(x) < 1e-6) return 1; var s = Math.sin(x) / x; return s * s; }
function pdf(z) {
  var P = period(), Z1 = DA * P;
  var env = function (c) { return sinc2(Math.PI * (z - c) / Z1); };
  if (S.slits === 'A') return env(-SLZ);
  if (S.slits === 'B') return env(SLZ);
  if (S.det) return 0.5 * (env(-SLZ) + env(SLZ));
  var c = Math.cos(Math.PI * z / P); return env(0) * c * c;
}
var CDF = null, CKEY = '';
function ensureCDF() {
  var key = S.src + S.slits + S.det + S.U + '|' + S.lam; if (key === CKEY) return; CKEY = key;
  var n = 1200, i, z, acc = 0; CDF = new Float32Array(n + 1);
  for (i = 0; i <= n; i++) { z = -ZM + 2 * ZM * i / n; acc += pdf(z); CDF[i] = acc; }
  for (i = 0; i <= n; i++) CDF[i] /= acc;
}
function sampleZ() {
  ensureCDF(); var u = Math.random(), lo = 0, hi = CDF.length - 1, m;
  while (hi - lo > 1) { m = (lo + hi) >> 1; if (CDF[m] < u) lo = m; else hi = m; }
  return -ZM + 2 * ZM * (lo + (u - CDF[lo]) / Math.max(1e-9, CDF[hi] - CDF[lo])) / (CDF.length - 1);
}
function cfgKey() { return S.src + '|' + S.slits + '|' + (S.det ? 'D' : '-'); }
function wl2rgb(w) {
  var r = 0, g = 0, b = 0, f;

  { h: 'Licht: von der Welle zum Photon', body: '<p>Im 17. Jahrhundert stellte sich <b>Isaac Newton</b> Licht als Strom kleinster Teilchen vor, <b>Christiaan Huygens</b> dagegen als Welle. Entschieden schien der Streit 1801 durch den <b>Doppelspaltversuch von Thomas Young</b>: Fällt Licht durch zwei dicht beieinander liegende Spalte, erscheinen auf einem Schirm abwechselnd helle und dunkle Streifen. Solche Interferenzmuster entstehen, wenn sich Wellen überlagern: An manchen Orten verstärken sie sich (Wellenberg trifft Wellenberg), an anderen löschen sie sich aus (Wellenberg trifft Wellental). Licht ist also eine Welle mit der Wellenlänge λ und der Frequenz f, es gilt c = λ·f.</p>'
    + '<p>Anfang des 20. Jahrhunderts zeigte der <b>Photoeffekt</b> ein anderes Gesicht: Trifft Licht auf eine Metallplatte, werden Elektronen herausgelöst, aber nur, wenn die Frequenz des Lichts groß genug ist. Wie hell das Licht ist, spielt dafür keine Rolle. Mit der Wellenvorstellung ließ sich das nicht erklären. <b>Albert Einstein</b> deutete es 1905 so: Licht besteht aus Energiepaketen, den <b>Photonen</b>. Ein Photon der Frequenz f hat die Energie</p>'
    + '<p class="fm">E = h · f &nbsp; (h = 6,626·10⁻³⁴ J·s, plancksches Wirkungsquantum)</p>'
    + '<p>und gibt diese Energie an genau ein Elektron ab. Das ist auch die Grundlage dafür, dass Licht chemische Reaktionen auslösen kann (Fotosynthese, Fotografie, Bleichen von Farbstoffen): Nur Photonen mit genug Energie bewirken etwas. Licht zeigt also beim Doppelspalt Wellen-, beim Photoeffekt Teilchencharakter.</p>',
    tasks: function (h) {
      h.appendChild(mk('p', '', '<b>Aufgabe A1:</b> Welche Beobachtung spricht für die Wellennatur des Lichts?'));
      mcq(h, ['Interferenzstreifen hinter einem Doppelspalt', 'Das Auslösen von Elektronen aus einer Metallplatte', 'Die Existenz einer Grenzfrequenz', 'Die Energie E = h·f'], null);
      h.appendChild(mk('p', '', '<b>Aufgabe A2:</b> Warum konnte die Wellenvorstellung den Photoeffekt nicht erklären?'));
      mcq(h, ['Elektronen werden nur oberhalb einer Grenzfrequenz ausgelöst, unabhängig von der Helligkeit des Lichts', 'Licht kann sich nicht durch Metalle ausbreiten', 'Elektronen sind zu schwer, um von Licht bewegt zu werden', 'Licht hat keine Energie'], null);
      h.appendChild(mk('p', '', '<b>Aufgabe A3:</b> Berechne die Energie eines Photons von grünem Licht (λ = 500 nm) in Elektronenvolt. Nutze E = h·f, c = λ·f, c = 3,00·10⁸ m/s, h = 6,626·10⁻³⁴ J·s und 1 eV = 1,602·10⁻¹⁹ J.'));
      numQ(h, { ans: 2.48, tol: 0.02, unit: 'eV', ok: 'E = h·c/λ ≈ 3,98·10⁻¹⁹ J ≈ 2,48 eV.' });
    } },
  { h: 'Elektronen: vom Teilchen zur Welle', body: '<p>Elektronen galten lange als Teilchen. <b>J. J. Thomson</b> wies 1897 in Kathodenstrahlen Teilchen mit fester Masse und fester Ladung nach; sie lassen sich in elektrischen und magnetischen Feldern ablenken. 1924 schlug <b>Louis de Broglie</b> vor, auch Teilchen eine Welle zuzuordnen. Ein Teilchen mit Masse m und Geschwindigkeit v hat dann die <b>de-Broglie-Wellenlänge</b></p>'
    + '<p class="fm">λ = h / (m · v)</p>'
    + '<p>Je schneller das Teilchen, desto kleiner die Wellenlänge. Elektronen, die mit 100 V beschleunigt wurden, haben λ ≈ 0,12 nm, das ist etwa der Abstand benachbarter Atome in einem Kristall. Gegenstände aus dem Alltag haben verschwindend kleine Wellenlängen, deshalb bemerken wir ihre Wellennatur nie.</p>'
    + '<p>1927 ließen <b>Clinton Davisson und Lester Germer</b> Elektronen an einem Nickelkristall streuen und beobachteten Beugungsmaxima, wie man sie von Röntgenstrahlung kennt. Damit war die Wellennatur der Elektronen nachgewiesen. 1961 führte <b>Claus Jönsson</b> den Doppelspaltversuch mit Elektronen aus und erhielt Interferenzstreifen. 1989 gelang <b>Akira Tonomura</b> mit seinem Team ein Versuch mit einzelnen Elektronen nacheinander: Jedes Elektron erzeugte einen punktförmigen Treffer, doch nach und nach entstand daraus das Interferenzmuster.</p>',
    tasks: function (h) {
      h.appendChild(mk('p', '', '<b>Aufgabe B1:</b> Wer wies mit Elektronenbeugung an einem Kristall die Wellennatur der Elektronen nach?'));
      mcq(h, ['Davisson und Germer', 'Thomson', 'Einstein', 'Young'], null);
      h.appendChild(mk('p', '', '<b>Aufgabe B2:</b> Warum eignet sich ein Kristall als Beugungsgitter für Elektronen von 100 V?'));
      mcq(h, ['Die Atomabstände im Kristall sind etwa so groß wie die Wellenlänge der Elektronen', 'Elektronen haben in Kristallen eine größere Masse', 'Kristalle sind elektrisch neutral', 'Elektronen sind kleiner als Atome'], null);
      h.appendChild(mk('p', '', '<b>Aufgabe B3:</b> Elektronen werden schneller. Was passiert mit ihrer Wellenlänge?'));
      mcq(h, ['Sie wird kleiner', 'Sie wird größer', 'Sie bleibt gleich', 'Sie hängt nur von der Ladung ab'], null);
    } },
  { h: 'Der Wellen-Teilchen-Dualismus und die Chemie', body: '<p>Für Licht und für Elektronen gilt dasselbe: Beim <b>Nachweis</b> erscheint das Objekt an genau einem Ort (ein Fleck auf dem Schirm, ein Klick im Detektor). Bei der <b>Ausbreitung</b> durch den Doppelspalt verhält es sich wie eine Welle, die beide Spalte erfasst. Photonen und Elektronen (ebenso Atome und Moleküle) heißen <b>Quantenobjekte</b>. Sie sind weder „kleine Kugeln“ noch „ausgedehnte Wellen“, je nach Experiment tritt der eine oder der andere Aspekt hervor. Das nennt man den <b>Wellen-Teilchen-Dualismus</b>.</p>'
    + '<p>Wie kommen dann die Streifen zustande? <b>Max Born</b> gab der Welle 1926 eine Deutung: Sie sagt nicht, wo das Elektron ist, sondern <b>wie wahrscheinlich</b> man es an einem Ort findet. Wo die Welle stark ist, treffen viele Elektronen auf, wo sie sich auslöscht, keines. Der Auftreffpunkt eines einzelnen Elektrons ist Zufall, die Verteilung vieler Treffer nicht. So baut sich aus einzelnen Punkten das Streifenmuster auf.</p>'
    + '<p>Kann man feststellen, <b>durch welchen Spalt</b> ein Quantenobjekt gegangen ist, verschwindet das Interferenzmuster. Schon die Möglichkeit, den Weg zu bestimmen, genügt.</p>'
    + '<p>Für die Chemie ist das folgenreich: Auch das Elektron in der Atomhülle ist ein Quantenobjekt. Es kreist nicht auf einer Bahn wie ein Planet um den Kern. Stattdessen gibt eine Welle an, wo man es mit welcher Wahrscheinlichkeit findet. Einen Raumbereich, in dem man ein Elektron mit hoher Wahrscheinlichkeit antrifft, nennt man <b>Orbital</b>. Form und Energie der Orbitale bestimmen den Bau des Periodensystems und wie Atome Bindungen eingehen. Im nächsten Modul erkundest du Orbitale.</p>',
    tasks: function (h) {
      h.appendChild(mk('p', '', '<b>Aufgabe C1:</b> Wähle für jede Lücke den passenden Begriff.'));
      var wrap = mk('div', 'luecke'), items = [
        ['Die Welle gibt an, mit welcher ', ['Wahrscheinlichkeit', 'Geschwindigkeit', 'Masse', 'Ladung'], 0, ' ein Elektron an einem Ort gefunden wird.'],
        ['Das Streifenmuster verschwindet, sobald der ', ['Weg', 'Druck', 'Schirm', 'Strom'], 0, ' durch den Doppelspalt bestimmt wird.'],
        ['Photonen und Elektronen heißen ', ['Quantenobjekte', 'Wellenpakete', 'Kugeln', 'Ionen'], 0, ', weil sie Teilchen- und Welleneigenschaften zeigen.'],
        ['Der Auftreffort eines einzelnen Elektrons ist ', ['zufällig', 'vorhersagbar', 'immer in der Mitte', 'abhängig von der Farbe'], 0, ', die Verteilung vieler Treffer nicht.']
      ], sels = [];
      items.forEach(function (it) {
        var line = mk('p', 'lz'), sel = mk('select'); sel.appendChild(new Option('wählen …', ''));
        shuffle(it[1].map(function (t, i) { return { t: t, i: i }; })).forEach(function (o) { sel.appendChild(new Option(o.t, o.i)); });
        line.appendChild(document.createTextNode(it[0])); line.appendChild(sel); line.appendChild(document.createTextNode(it[3])); wrap.appendChild(line); sels.push(sel);
      });
      var fb = mk('div'); h.appendChild(wrap);
      h.appendChild(btn('Prüfen', 'small', function () { var n = 0; sels.forEach(function (sl) { var good = sl.value === '0'; sl.className = sl.value === '' ? '' : (good ? 'good' : 'bad'); if (good) n++; }); fb.className = n === sels.length ? 'fb ok' : 'fb no'; fb.textContent = n === sels.length ? '✔ Alles richtig.' : n + ' von ' + sels.length + ' Lücken richtig. Prüfe die rot markierten noch einmal.'; if (n === sels.length) burst(wrap); }));
      h.appendChild(fb);
      h.appendChild(mk('p', '', '<b>Aufgabe C2:</b> Ein einzelnes Elektron trifft in einem Doppelspaltexperiment auf den Schirm. Was lässt sich vorhersagen?'));
      mcq(h, ['Nur die Wahrscheinlichkeit, mit der es in einem bestimmten Bereich auftrifft', 'Der genaue Auftreffpunkt', 'Der Spalt, durch den es sicher geflogen ist', 'Dass es immer in einem Interferenzmaximum landet'], null);
      h.appendChild(mk('p', '', '<b>Aufgabe C3:</b> Was bedeutet das für das Elektron in der Atomhülle?'));
      mcq(h, ['Man kann nur angeben, mit welcher Wahrscheinlichkeit es sich wo aufhält (Orbital)', 'Es bewegt sich auf einer festen Kreisbahn um den Kern', 'Es ruht an einem festen Ort im Atom', 'Es verlässt das Atom, sobald man es beobachtet'], null);
    } }
];

  ['Das Streifenmuster entsteht auch dann, wenn die Elektronen einzeln nacheinander durch den Doppelspalt geschickt werden.', true, 'Jedes Elektron verhält sich wie eine Welle, die beide Spalte erfasst; die Verteilung der Treffer folgt der Wahrscheinlichkeit.'],
  ['Mit eingeschaltetem Weg-Detektor bleibt das Streifenmuster erhalten.', false, 'Wenn der Weg bestimmt wird, verschwindet die Interferenz.'],

  }
}
