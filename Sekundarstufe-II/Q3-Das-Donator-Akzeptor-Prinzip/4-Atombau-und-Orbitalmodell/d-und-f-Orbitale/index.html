<script>

/* ====== Helfer ====== */
function $(id) { return document.getElementById(id); }

function mcq(host, opts, onOk) {
  var box = mk('div', 'opts'), done = false;
  shuffle(opts.map(function (t, i) { return { t: t, ok: i === 0 }; })).forEach(function (o) {
