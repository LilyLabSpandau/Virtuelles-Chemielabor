<script>
'use strict';
/* ====== Helfer ====== */
function $(id) { return document.getElementById(id); }
function mk(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function btn(label, cls, fn, dis) { var b = mk('button', 'btn ' + (cls || ''), label); b.type = 'button'; if (dis) b.disabled = true; b.addEventListener('click', fn); return b; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function burst(host) {
  var r = host.getBoundingClientRect(), b = mk('div', 'burst'), i, p;
  b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top + Math.min(r.height / 2, 200)) + 'px';
  for (i = 0; i < 18; i++) { p = mk('i'); p.style.background = ['#7df9ff', '#8b5cff', '#5ee6a8', '#ffd166'][i % 4]; p.style.setProperty('--dx', Math.round(rnd(-120, 120)) + 'px'); p.style.setProperty('--dy', Math.round(rnd(-120, 60)) + 'px'); b.appendChild(p); }
  document.body.appendChild(b); setTimeout(function () { b.remove(); }, 1000);
}
/* Mehrfachauswahl: opts[0] ist richtig, die Anzeige wird gemischt */
function mcq(host, opts, onOk) {
  var box = mk('div', 'opts'), done = false;
  shuffle(opts.map(function (t, i) { return { t: t, ok: i === 0 }; })).forEach(function (o) {
    var b = mk('button', 'opt', o.t); b.type = 'button';
    b.addEventListener('click', function () {
      if (done) return;
      if (o.ok) { done = true; b.className = 'opt good'; burst(b); if (onOk) onOk(); } else { b.className = 'opt bad'; }
    });
    box.appendChild(b);
  });
  host.appendChild(box); return box;
}
function numQ(host, o, onOk) {
  var row = mk('div', 'row'), inp = mk('input', 'num'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = o.ph || 'Ergebnis'; inp.setAttribute('aria-label', 'Ergebnis');
  var fb = mk('div'), done = false;
  row.appendChild(inp); row.appendChild(mk('span', 'muted', o.unit));
  row.appendChild(btn('Prüfen', 'small', function () {
    if (done) return;
    var v = parseFloat(String(inp.value).replace(',', '.'));
    if (isNaN(v)) { fb.className = 'fb info'; fb.textContent = 'Gib eine Zahl ein.'; return; }
    if (Math.abs(v - o.ans) <= Math.abs(o.ans) * (o.tol || 0.03)) { done = true; fb.className = 'fb ok'; fb.innerHTML = '✔ Richtig. ' + (o.ok || ''); burst(row); if (onOk) onOk(); }
    else { fb.className = 'fb no'; fb.textContent = 'Das stimmt noch nicht. Prüfe Formel, Einheiten und Zehnerpotenzen.'; }
  }));
  host.appendChild(row); host.appendChild(fb);
}

/* ====== Orbitale: Wellenfunktionen (Wasserstoff-Näherung, Einheiten a0) ====== */
var SQ = Math.sqrt;
var ORB = {
  '1s': { n: 1, ang: 's', rmax: 14, R: function (r) { return 2 * Math.exp(-r); } },
  '2s': { n: 2, ang: 's', rmax: 34, R: function (r) { return (2 - r) * Math.exp(-r / 2) / (2 * SQ(2)); } },
  '2px': { n: 2, ang: 'x', rmax: 34, R: function (r) { return r * Math.exp(-r / 2) / (2 * SQ(6)); } },
  '2py': { n: 2, ang: 'y', rmax: 34, R: function (r) { return r * Math.exp(-r / 2) / (2 * SQ(6)); } },
  '2pz': { n: 2, ang: 'z', rmax: 34, R: function (r) { return r * Math.exp(-r / 2) / (2 * SQ(6)); } },
  '3s': { n: 3, ang: 's', rmax: 70, R: function (r) { return 2 * (27 - 18 * r + 2 * r * r) * Math.exp(-r / 3) / (81 * SQ(3)); } },
  '3pz': { n: 3, ang: 'z', rmax: 70, R: function (r) { return 8 * r * (1 - r / 6) * Math.exp(-r / 3) / (27 * SQ(6)); } }
};
var GN = 1500;
(function () {
  Object.keys(ORB).forEach(function (k) {
    var o = ORB[k], i, r, acc = 0; o.cdf = new Float32Array(GN + 1); o.pr = new Float32Array(GN + 1);
    for (i = 0; i <= GN; i++) { r = o.rmax * i / GN; o.pr[i] = r * r * Math.pow(o.R(r), 2); acc += o.pr[i]; o.cdf[i] = acc; }
    for (i = 0; i <= GN; i++) o.cdf[i] /= acc;
    for (i = 0; i <= GN; i++) if (o.cdf[i] >= 0.9) { o.r90 = o.rmax * i / GN; break; }
    var mx = 0; for (i = 0; i <= GN; i++) mx = Math.max(mx, o.pr[i]); o.prmax = mx;

    if (S.en.puz) { b2.appendChild(mk('div', 'fb ok', '✔ Richtig: 1s < 2s < 2p < 3s < 3p < 4s < 3d. Merke: Das 4s-Orbital liegt energetisch <b>unter</b> dem 3d-Orbital. Das erklärt, warum zuerst 4s gefüllt wird (Kalium, Calcium) und erst danach 3d (Scandium bis Zink).')); b2.appendChild(nextBtn('Weiter zum Fazit →', 5)); }
    else if (S.en.err && chosen.length === ORDER.length) b2.appendChild(mk('div', 'fb no', 'Das ist noch nicht richtig. Rechne n + l für jedes Orbital aus und beachte die Regel bei gleicher Summe.'));
    p.appendChild(b2);
  }
}

/* ====== Schritt 5: Fazit ====== */
var FZ = [
  ['Das Bohr-Modell beschreibt das Elektron auf einer festen Bahn, das Orbitalmodell beschreibt eine Aufenthaltswahrscheinlichkeit.', true, 'Das Orbitalmodell ersetzt die Bahn durch die Wahrscheinlichkeit, das Elektron an einem Ort zu finden.'],
  ['Ein Orbital ist der Raumbereich, in dem sich ein Elektron mit hoher Wahrscheinlichkeit (z. B. 90 %) aufhält.', true, 'Orbitale haben keine scharfe Grenze; die 90 %-Fläche ist eine Konvention.'],
  ['In einem Orbital finden bis zu vier Elektronen Platz.', false, 'Höchstens zwei, mit entgegengesetztem Spin (Pauli-Prinzip).'],
  ['Die drei 2p-Orbitale haben dieselbe Form und stehen senkrecht aufeinander.', true, 'Sie liegen entlang der x-, y- und z-Achse.'],
  ['Das 2s-Orbital hat keine Knotenfläche.', false, 'Das 2s-Orbital hat eine kugelförmige Knotenfläche (1s keine, 2s eine, 3s zwei).'],
  ['In der dritten Schale (n = 3) gibt es 9 Orbitale.', true, '3s (1) + 3p (3) + 3d (5) = 9 = n².'],
  ['In Mehrelektronenatomen liegt das 4s-Orbital energetisch unter dem 3d-Orbital.', true, 'Deshalb wird 4s vor 3d aufgefüllt.']
];
function panelFazit(p) {
  p.appendChild(mk('h2', '', '5 · Fazit: Richtig oder falsch?')); var n = 0;
  FZ.forEach(function (f, i) {
    var row = mk('div', 'obs'); row.appendChild(mk('div', 'otxt', f[0])); var bs = mk('div', 'ob'), ans = S.tf[i];
    [[true, 'Richtig'], [false, 'Falsch']].forEach(function (a) { var b = mk('button', 'sel' + (ans === a[0] ? (a[0] === f[1] ? ' good' : ' bad') : ''), a[1]); b.type = 'button'; b.addEventListener('click', function () { if (ans === f[1]) return; S.tf[i] = a[0]; panel(); }); bs.appendChild(b); });
    row.appendChild(bs); if (ans === f[1]) { n++; row.appendChild(mk('div', 'fb ok', '✔ ' + f[2])); } else if (ans !== undefined) row.appendChild(mk('div', 'fb no', 'Das stimmt nicht. Denke an die Experimente und Diagramme.'));
    p.appendChild(row);
  });
  if (n === FZ.length) {
    p.appendChild(mk('div', 'fb ok', '<b>Geschafft.</b> Merke dir:<ul class="rules"><li>Orbital = Raum hoher Aufenthaltswahrscheinlichkeit des Elektrons, keine Bahn.</li><li>n legt Schale und Größe fest, l die Form (s, p, d, f), m die Orientierung.</li><li>Ein Orbital fasst zwei Elektronen mit entgegengesetztem Spin.</li><li>Knotenflächen: Dort ist die Aufenthaltswahrscheinlichkeit null.</li><li>Energiereihenfolge (Mehrelektronenatome): 1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d.</li></ul>Im nächsten Modul besetzt du die Orbitale mit Elektronen (Elektronenkonfiguration).'));
    var r = mk('div', 'row'); var a = mk('a', 'btn go', 'Zurück zur Übersicht'); a.href = '../index.html'; a.style.textDecoration = 'none'; r.appendChild(a); p.appendChild(r);
  }
}
function panel() { var p = $('panel'); p.innerHTML = ''; if (S.step <= 2) panelTasks(p); else if (S.step === 3) panelQN(p); else if (S.step === 4) panelEnergy(p); else panelFazit(p); }
