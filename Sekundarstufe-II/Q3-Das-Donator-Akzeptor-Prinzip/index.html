    /* Bühne mit festem Seitenverhältnis des Bildes, damit die Klickflächen auf jedem Gerät passen */
    .stage {

      border-radius: 14px;

      background: rgba(255, 255, 255, 0.25);

    /* Beschriftung unter dem Gegenstand */
    .label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: calc(var(--w) * 0.006);
      width: max-content;
      max-width: calc(var(--w) * 0.26);
      text-align: center;
      font-weight: 700;
      line-height: 1.15;
      color: #8b1a1a;
      font-size: max(11px, calc(var(--w) * 0.022));
    }

    .label.above {
      top: auto;
      bottom: 100%;
      margin-top: 0;
      margin-bottom: calc(var(--w) * 0.006);

    .link-5 { left: 19%; top: 68%; width: 10%; height: 16%; }  /* Arbeitentraining und Wiederholung */
    .link-5 svg, .link-4 svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 6px rgba(0,0,0,.28)); }

    .label.train { max-width: calc(var(--w) * 0.26); }

    .back-link {
      position: absolute;
      left: 50%;
      top: 1.2%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: white;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5em 0.9em;
      border-radius: 8px;
      font-weight: 700;
      font-size: max(11px, calc(var(--w) * 0.0105));
    }
    .back-link:hover { background: rgba(0, 0, 0, 0.8); }

    /* Hochkant-Bildschirme (Handy): Beschriftung größer, damit sie lesbar bleibt */

      .back-link { top: auto; bottom: 1.5%; }
      .link-5 { left: 8%; }
    }
