<script>
'use strict';
/* ================= Spektral-Engine ================= */
const NL = 81, L0 = 380, DL = 5;
const WL = []; for (let i = 0; i < NL; i++) WL.push(L0 + i * DL);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sig = x => 1 / (1 + Math.exp(-x));
function gA(x, m, s1, s2) { const t = (x - m) / (x < m ? s1 : s2); return Math.exp(-0.5 * t * t); }
function gs(x, m, s) { const t = (x - m) / s; return Math.exp(-0.5 * t * t); }
function cmf(l) {
  return [
    1.056 * gA(l, 599.8, 37.9, 31.0) + 0.362 * gA(l, 442.0, 16.0, 26.7) - 0.065 * gA(l, 501.1, 20.4, 26.2),
    0.821 * gA(l, 568.8, 46.9, 40.5) + 0.286 * gA(l, 530.9, 16.3, 31.1),
    1.217 * gA(l, 437.0, 11.8, 36.0) + 0.681 * gA(l, 459.0, 26.0, 13.8)];
}
function xyz2lin(c) {
  return [3.2406 * c[0] - 1.5372 * c[1] - 0.4986 * c[2], -0.9689 * c[0] + 1.8758 * c[1] + 0.0415 * c[2], 0.0557 * c[0] - 0.2040 * c[1] + 1.0570 * c[2]];
}
/* Pro Wellenlänge linearer RGB-Beitrag; gleichenergetisches Spektrum (S=1) ergibt exakt Weiß (1,1,1) */
const RGBL = (function () {
  const t = WL.map(l => xyz2lin(cmf(l)).map(v => Math.max(0, v)));
  // Tiefrot (> 640 nm): Näherung liefert dort Grünanteile -> reines Rot, Helligkeit nach Hellempfindlichkeit
  const i640 = (640 - L0) / DL, y640 = cmf(640)[1], r640 = t[i640][0];
  WL.forEach((l, i) => { if (l > 640) t[i] = [r640 * cmf(l)[1] / y640, 0, 0]; });
  for (let c = 0; c < 3; c++) { let s = 0; t.forEach(r => s += r[c]); t.forEach(r => r[c] /= s); }
  return t;
})();
function gam(v) { v = clamp(v, 0, 1); return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; }
function specLin(S) {
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < NL; i++) { const s = S[i], q = RGBL[i]; r += s * q[0]; g += s * q[1]; b += s * q[2]; }
  return [r, g, b];
}
function linRGB255(l) { return l.map(v => Math.round(gam(v) * 255)); }
function rgbHex(c) { return '#' + c.map(v => ('0' + clamp(Math.round(v), 0, 255).toString(16)).slice(-2)).join(''); }
function specHex(S, k) { const l = specLin(S); k = k || 1; return rgbHex(linRGB255(l.map(v => v * k))); }
function lumY(l) { return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2]; }
/* Farbe einer einzelnen Wellenlänge (für Anzeige, normiert auf max. Kanal) */
function monoRGB(l) {
  let f = (l - L0) / DL; f = clamp(f, 0, NL - 1.001); const i = Math.floor(f), t = f - i;
  const a = RGBL[i], b = RGBL[i + 1]; const v = [0, 1, 2].map(c => lerp(a[c], b[c], t));
  const m = Math.max(v[0], v[1], v[2]) || 1;
  let k = 1; if (l < 420) k = 0.25 + 0.75 * (l - 380) / 40; if (l > 680) k = 0.25 + 0.75 * clamp((780 - l) / 100, 0, 1);
  if (l < 380 || l > 780) k = 0;
  return v.map(x => x / m * k);
}
function monoHex(l) { return rgbHex(monoRGB(l).map(v => gam(v) * 255)); }
function makeSpec(fn) { return WL.map(fn); }
function specMul(a, b) { return a.map((v, i) => v * b[i]); }
function lampSpec(kind) {
  if (kind === 'weiss') return makeSpec(() => 1);
  const c = { rot: [630, 11], gruen: [535, 11], blau: [460, 11], na: [589, 3] }[kind];
  const raw = makeSpec(l => gs(l, c[0], c[1]));
  const k = 0.8 / lumY(specLin(raw)); return raw.map(v => v * k);
}
function interp(arr, l) { const f = clamp((l - L0) / DL, 0, NL - 1.001), i = Math.floor(f); return lerp(arr[i], arr[i + 1], f - i); }

/* Komplementärfarben-Tabelle (absorbierte Farbe -> sichtbare Farbe) */
function complOf(l) {
  const T = [[380, 'UV (nicht sichtbar)', 'farblos'], [430, 'Violett', 'Gelbgrün'], [480, 'Blau', 'Gelb bis Orange'], [490, 'Grünblau', 'Orange'], [500, 'Blaugrün', 'Rot'],
    [560, 'Grün', 'Purpur / Magenta'], [580, 'Gelbgrün', 'Violett'], [600, 'Gelb', 'Blau'], [650, 'Orange', 'Blaugrün (Cyan)'], [781, 'Rot', 'Grünblau']];
  if (l < 380) return { a: T[0][1], o: T[0][2] };
  for (let i = 1; i < T.length; i++) if (l < T[i][0]) return { a: T[i][1], o: T[i][2] };
  return { a: 'Rot', o: 'Grünblau' };
}

/* ================= Diagramm ================= */
function plot(o) {
  const cv = $('graph'), c = cv.getContext('2d'), W = cv.width, H = cv.height;
  c.clearRect(0, 0, W, H); c.fillStyle = '#0b0f15'; c.fillRect(0, 0, W, H);
  const m = { l: 56, r: 14, t: 14, b: o.bar ? 62 : 44 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = x => m.l + (x - o.xmin) / (o.xmax - o.xmin) * pw, Y = y => m.t + ph - (y - o.ymin) / (o.ymax - o.ymin) * ph;
  (o.bands || []).forEach(b => { c.fillStyle = b.color; const y1 = Y(b.ymax), y2 = Y(b.ymin); c.fillRect(m.l, y1, pw, y2 - y1); });
  c.font = '13px Segoe UI, sans-serif'; c.lineWidth = 1;
  const xt = o.xt || (o.xmax - o.xmin) / 5, yt = o.yt || (o.ymax - o.ymin) / 4;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let x = Math.ceil(o.xmin / xt - 1e-9) * xt; x <= o.xmax + 1e-9; x += xt) {
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.beginPath(); c.moveTo(X(x), m.t); c.lineTo(X(x), m.t + ph); c.stroke();
    c.fillStyle = '#9fb0bd'; c.fillText(+x.toFixed(2) + '', X(x), m.t + ph + 4);
  }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let y = Math.ceil(o.ymin / yt - 1e-9) * yt; y <= o.ymax + 1e-9; y += yt) {
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.beginPath(); c.moveTo(m.l, Y(y)); c.lineTo(m.l + pw, Y(y)); c.stroke();
    c.fillStyle = '#9fb0bd'; c.fillText(+y.toFixed(2) + '', m.l - 6, Y(y));
  }
  c.strokeStyle = 'rgba(255,255,255,0.45)'; c.strokeRect(m.l, m.t, pw, ph);
  if (o.bar) {
    const by = m.t + ph + 20, bh = 10;
    for (let px = 0; px < pw; px++) { const l = o.xmin + px / pw * (o.xmax - o.xmin); if (l < 380 || l > 780) continue; c.fillStyle = monoHex(l); c.fillRect(m.l + px, by, 1.5, bh); }
  }
  c.save(); c.beginPath(); c.rect(m.l, m.t, pw, ph); c.clip();
  (o.series || []).forEach(s => {
    const xs = s.xs, ys = s.ys;
    if (s.fill) {
      c.beginPath(); c.moveTo(X(xs[0]), Y(Math.max(o.ymin, 0)));
      for (let i = 0; i < xs.length; i++) c.lineTo(X(xs[i]), Y(ys[i]));
      c.lineTo(X(xs[xs.length - 1]), Y(Math.max(o.ymin, 0))); c.closePath(); c.fillStyle = s.fill; c.fill();
    }
    if (s.pts) {
      c.fillStyle = s.color; xs.forEach((x, i) => { c.beginPath(); c.arc(X(x), Y(ys[i]), s.r || 4, 0, 7); c.fill(); });
    } else {
      c.beginPath(); xs.forEach((x, i) => i ? c.lineTo(X(x), Y(ys[i])) : c.moveTo(X(x), Y(ys[i])));
      c.strokeStyle = s.color; c.lineWidth = s.w || 2.2; c.setLineDash(s.dash || []); c.stroke(); c.setLineDash([]);
    }
  });
  (o.vlines || []).forEach(v => {
    c.strokeStyle = v.color || '#ffe082'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(X(v.x), m.t); c.lineTo(X(v.x), m.t + ph); c.stroke(); c.setLineDash([]);
  });
  (o.hlines || []).forEach(v => {
    c.strokeStyle = v.color || '#ffe082'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(m.l, Y(v.y)); c.lineTo(m.l + pw, Y(v.y)); c.stroke(); c.setLineDash([]);
  });
  c.restore();
  c.lineWidth = 1;
  (o.vlines || []).forEach(v => { if (v.label) { c.fillStyle = v.color || '#ffe082'; c.font = '12px Segoe UI'; c.textAlign = v.x > (o.xmin + o.xmax) / 2 ? 'right' : 'left'; c.textBaseline = 'top'; c.fillText(v.label, X(v.x) + (v.x > (o.xmin + o.xmax) / 2 ? -5 : 5), m.t + 3); } });
  c.fillStyle = '#cfd8dc'; c.font = '13px Segoe UI'; c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillText(o.xlabel || '', m.l + pw / 2, H - 2);
  c.save(); c.translate(13, m.t + ph / 2); c.rotate(-Math.PI / 2); c.textBaseline = 'top'; c.fillText(o.ylabel || '', 0, 0); c.restore();
  let ly = m.t + 6; c.textAlign = 'right'; c.textBaseline = 'middle'; c.font = '12px Segoe UI';
  (o.series || []).forEach(s => { if (!s.label) return; const w = c.measureText(s.label).width; c.fillStyle = 'rgba(11,15,21,0.75)'; c.fillRect(m.l + pw - w - 30, ly - 8, w + 26, 16); c.fillStyle = s.color; c.fillRect(m.l + pw - 22, ly - 2, 16, 4); c.fillStyle = '#e3eaf0'; c.fillText(s.label, m.l + pw - 26, ly); ly += 17; });
}

/* ================= Szene ================= */
const container = $('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c1016);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dl = new THREE.DirectionalLight(0xffffff, 0.65); dl.position.set(6, 14, 8); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x9db4d4, 0.25); dl2.position.set(-8, 6, -6); scene.add(dl2);
(function () {
  const t = new THREE.Mesh(new THREE.BoxGeometry(34, 0.4, 24), new THREE.MeshLambertMaterial({ color: 0x1c2430 })); t.position.y = -0.2; scene.add(t);
  const g = new THREE.GridHelper(34, 34, 0x2f3d50, 0x232e3d); g.position.y = 0.01; scene.add(g);
})();
function mat(c, o) { return new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {})); }
function box(w, h, d, c, x, y, z, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); (parent || scene).add(m); return m; }
function cyl(rt, rb, h, c, x, y, z, parent, seg) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 24), mat(c)); m.position.set(x, y, z); (parent || scene).add(m); return m; }
/* Lichtstrahl als dünner Zylinder zwischen zwei Punkten */
const UPV = new THREE.Vector3(0, 1, 0);
function mkBeam(parent, r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r || 0.035, r || 0.035, 1, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, toneMapped: false, depthWrite: false }));
  m.visible = false; parent.add(m); return m;
}
function setBeam(m, a, b, hex, op) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  if (len < 1e-4 || op <= 0.01) { m.visible = false; return; }
  m.visible = true; m.position.copy(a).add(b).multiplyScalar(0.5); m.scale.set(1, len, 1);
  m.quaternion.setFromUnitVectors(UPV, d.normalize()); m.material.color.set(hex); m.material.opacity = op;
}
function labelTex(draw, w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const c = cv.getContext('2d'); draw(c, w, h);
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return { tex: t, cv: cv, ctx: c };
}

/* Kamera */
const cam = { th: 0.0, ph: 1.0, r: 16, t: new THREE.Vector3(0, 1, 0) };
function updateCamera() {
  const s = Math.sin(cam.ph);
  const rr = cam.r * (innerWidth < 760 ? 1.25 : 1); camera.position.set(cam.t.x + rr * s * Math.sin(cam.th), cam.t.y + rr * Math.cos(cam.ph), cam.t.z + rr * s * Math.cos(cam.th));
  camera.lookAt(cam.t);
}

    theory: '<b>Warum ist eine Lösung farbig?</b> Die gelösten Teilchen (Ionen oder Moleküle) <b>nehmen eine Farbe aus dem weißen Licht heraus</b> (Absorption). Die übrigen Farben mischen sich zur Farbe, die wir sehen. Das ist immer die <b>Komplementärfarbe</b> – die Farbe, die im <b>Farbkreis gegenüber</b> liegt.<ul><li>Absorbiert wird Grün → Lösung sieht <b>violett</b> aus (z. B. Kaliumpermanganat)</li><li>Absorbiert wird Rot/Orange → Lösung sieht <b>blau</b> aus (z. B. Kupfer(II)-sulfat)</li><li>Absorbiert wird Blau/Grünblau → Lösung sieht <b>orange</b> aus (z. B. Kaliumdichromat)</li></ul>' +
      '<b>Begriffe:</b> Das Licht wird von den Teilchen <b>absorbiert</b> (aufgenommen); was nicht absorbiert wird, wird <b>durchgelassen</b> (Transmission) und trifft unser Auge. Bei klaren Lösungen spielt Reflexion kaum eine Rolle.<br>' +
      '<b>Wovon hängt die Farbintensität ab?</b> Je <b>mehr gelöste Teilchen</b> im Lichtweg, desto mehr Licht wird absorbiert und desto <b>kräftiger</b> ist die Farbe. Die <b>absorbierte Farbe bleibt dieselbe</b>, aber es wird mehr davon aufgenommen. Die <b>Komplementärfarbe</b> zur absorbierten Farbe ist der Farbton, dem die Lösung bei hoher Konzentration am nächsten kommt. Bei wenig Teilchen fehlt nur ein schmaler Bereich im Spektrum, die Lösung wirkt hell und kann noch etwas von dieser Farbe abweichen (z. B. hellgelb). Bei vielen Teilchen werden auch die Ränder der Absorptionsbande aufgenommen, es fehlen mehr Nachbarfarben, und die <b>sichtbare Farbe ändert sich</b> (z. B. Kaliumdichromat: hellgelb → gelb → orange → dunkelorange). (Dieser Zusammenhang ist die Grundlage der Konzentrationsbestimmung mit dem Photometer.)<br>' +
      '<b>Energie:</b> Blaues und violettes Licht ist <b>energiereich</b>, rotes Licht <b>energiearm</b>. Ein Stoff, der energiereiches (blaues) Licht absorbiert, erscheint gelb bis orange. Absorbiert er energiearmes (rotes) Licht, erscheint er blau bis grün.<br>' +
      '<b>Achtung, Faustregel:</b> Die Komplementärfarbe zeigt nur ungefähr, welche Farbe man sieht. Die Absorptionsbanden sind breit und nehmen auch Nachbarfarben auf. Deshalb kann die sichtbare Farbe um ein Feld im Farbkreis abweichen (z. B. Kaliumpermanganat: absorbiert wird Grün, die Komplementärfarbe wäre Purpur, die Lösung sieht aber violett aus).<br><b>Warum nimmt ein Stoff gerade diese Farbe weg?</b> Das hängt vom Aufbau der Teilchen ab: Elektronen nehmen die Energie des Lichts auf. Welche Farbe das ist, klären wir später bei den Farbstoffen.<br>' +
      '<b>So geht der Versuch:</b> ① Wähle eine Lösung. ② Sieh auf dem Schirm, welche Farbe im Spektrum fehlt (dunkle Stelle). ③ Schau im Diagramm „Farbkreis“, welche Farbe gegenüber liegt. ④ Verändere die Konzentration.',
    cams: {
      'Übersicht': { th: -0.85, ph: 1.0, r: 16, t: [0, 1.4, 0] },
      'Schirm': { th: -0.6, ph: 1.15, r: 9, t: [4, 1.8, 0] },
      'Von oben': { th: 0, ph: 0.4, r: 15, t: [0, 0, 0] }
    },
    build(group) {
      box(1.6, 1.2, 1.2, 0x39424f, -6.8, 1.5, 0, group); const lz = new THREE.Mesh(new THREE.CircleGeometry(0.34, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); lz.position.set(-5.98, 1.5, 0); lz.rotation.y = Math.PI / 2; group.add(lz);
      box(0.8, 0.9, 0.8, 0x2a313c, -6.8, 0.45, 0, group).position.y = 0.45;
      const gl = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 3.0, 32, 1, true), new THREE.MeshPhongMaterial({ color: 0xcfe9ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false })); gl.position.set(0, 1.5, 0); group.add(gl);
      liq = new THREE.Mesh(new THREE.CylinderGeometry(1.14, 1.14, 2.3, 32), new THREE.MeshBasicMaterial({ color: 0xff00ff, toneMapped: false })); liq.position.set(0, 1.3, 0); group.add(liq);
      scrT = labelTex(() => { }, 768, 384);
      const sc = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.5), new THREE.MeshBasicMaterial({ map: scrT.tex, toneMapped: false })); sc.position.set(5.5, 2.0, 0); sc.rotation.y = -Math.PI / 2; group.add(sc);
      box(0.15, 0.8, 0.15, 0x555d68, 5.55, 0.4, 0, group);
      beamA = mkBeam(group, 0.07); beamB = mkBeam(group, 0.07);
    },
    setup() {
      C.chips('① Lösung wählen', Object.keys(SUB).map(k => ({ k, t: SUB[k].n })), S.sub, k => { S.sub = k; refresh(); });
      C.slider('④ Konzentration (Menge gelöster Teilchen)', 5, 100, 1, S.frac * 100, v => v + ' %', v => { S.frac = v / 100; refresh(); });
    },
    update, readout,
    graphs: [
      {
        t: 'Farbkreis', draw() {
          const cv = $('graph'), c = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W * 0.64, cy = H / 2, R = 128, r0= 60, ia = absSeg(S.sub), io = (ia + 5) % 10, iv = visInfo().seg;
          c.fillStyle = '#0b0f15'; c.fillRect(0, 0, W, H);
          const ang = i => (-90 + i * 36 - 18) * Math.PI / 180;
          SEG.forEach((g, i) => { c.beginPath(); c.arc(cx, cy, R, ang(i), ang(i + 1)); c.arc(cx, cy, r0, ang(i + 1), ang(i), true); c.closePath(); c.fillStyle = g.c; c.fill(); c.strokeStyle = '#0b0f15'; c.lineWidth = 2; c.stroke(); });
          const mid = i => (ang(i) + ang(i + 1)) / 2;
          c.font = 'bold 13px Segoe UI'; c.textAlign = 'center'; c.textBaseline = 'middle';
          SEG.forEach((g, i) => { const rr = (R + r0) / 2, t = mid(i); c.fillStyle = (i === 1 || i === 0) ? '#222' : '#fff'; c.fillText(g.n, cx + Math.cos(t) * rr, cy + Math.sin(t) * rr); });
          const outline = (i, col) => { c.beginPath(); c.arc(cx, cy, R + 3, ang(i), ang(i + 1)); c.arc(cx, cy, r0 - 3, ang(i + 1), ang(i), true); c.closePath(); c.strokeStyle = col; c.lineWidth = 4; c.stroke(); };
          outline(ia, '#ffffff'); outline(io, '#ffd54f');
          c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1.5; const ta = mid(ia), to = mid(io); c.beginPath(); c.moveTo(cx + Math.cos(ta) * (r0 - 4), cy + Math.sin(ta) * (r0 - 4)); c.lineTo(cx + Math.cos(to) * (r0 - 4), cy + Math.sin(to) * (r0 - 4)); c.stroke(); c.setLineDash([]);
          c.font = 'bold 14px Segoe UI'; c.fillStyle = '#fff';
          const lab = (i, txt) => { const t = mid(i), x = cx + Math.cos(t) * (R + 38), y = cy + Math.sin(t) * (R + 22); c.fillText(txt, Math.max(40, Math.min(W - 40, x)), y); };
                    { const t = mid(iv), rr = R + 16, x = cx + Math.cos(t) * rr, y = cy + Math.sin(t) * rr; c.fillStyle = visInfo().hex; c.beginPath(); c.arc(x, y, 9, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); }
          c.fillStyle = specHex(trans()); c.beginPath(); c.arc(cx, cy, r0 - 12, 0, 7); c.fill();
          c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = 'bold 15px Segoe UI';
          const L = [['#ffffff', 'absorbierte Farbe (fest)'], ['#ffd54f', 'Komplementärfarbe (fest)'], ['dot', 'Farbe, die man bei dieser', 'Konzentration sieht']];
          let ly = 70; L.forEach(it => { if (it[0] === 'dot') { c.fillStyle = specHex(trans()); c.beginPath(); c.arc(34, ly, 9, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); } else { c.strokeStyle = it[0]; c.lineWidth = 4; c.strokeRect(25, ly - 9, 18, 18); }
            c.fillStyle = '#e8eef3'; c.fillText(it[1], 56, ly - (it[2] ? 9 : 0)); if (it[2]) c.fillText(it[2], 56, ly + 11); ly += it[2] ? 70 : 56; });
        }
      },
      {
        t: 'Absorptionsspektrum', draw() {
          const ys = WL.map(l => Aof(S.sub, l, S.frac)), mx = Math.max(0.5, ...ys) * 1.15;
          plot({ xmin: 380, xmax: 780, ymin: 0, ymax: mx, xt: 50, yt: mx > 3 ? 1 : (mx > 1.2 ? 0.5 : 0.25), xlabel: 'Farbe des Lichts (Wellenlänge in nm)', ylabel: 'Absorption', bar: true, series: [{ xs: WL, ys, color: '#ffe082', w: 3, fill: 'rgba(255,224,130,0.12)' }] });
        }
      }
    ],
    tasks: [
      { type: 'choice', q: 'Kaliumdichromat sieht orange aus. Wurde dabei energiereiches oder energiearmes Licht absorbiert?', opts: ['Energiereiches (Blau/Violett)', 'Energiearmes (Rot)'], correct: 0, expl: 'Blau und Violett fehlen im Licht; sie sind die energiereichen Farben.' },
      { type: 'choice', q: 'Kaliumpermanganat-Lösung sieht violett aus. Welche Farbe absorbiert sie?', opts: ['Violett', 'Grün', 'Gelb', 'Rot'], correct: 1, expl: 'Es fehlt Grün im Spektrum (dunkle Stelle auf dem Schirm). Grün und Violett liegen im Farbkreis gegenüber.' },
      { type: 'choice', q: 'Kupfer(II)-sulfat-Lösung ist blau. Welche Farbe wird vor allem absorbiert?', opts: ['Blau', 'Violett', 'Rot / Orange', 'Grün'], correct: 2, expl: 'Rot/Orange fehlt, übrig bleibt Blau(grün) – die Komplementärfarbe.' },
      { type: 'choice', q: 'Kaliumdichromat-Lösung ist orange. Welche Farbe wird absorbiert?', opts: ['Blau / Grünblau', 'Orange', 'Rot', 'Grün'], correct: 0, expl: 'Blau bis Grünblau wird aus dem Licht genommen; Gelb, Orange und Rot bleiben übrig. Im Farbkreis liegt Grünblau gegenüber von Orange.' },
      { type: 'choice', q: 'Du erhöhst bei Kaliumdichromat die Konzentration von 5 % auf 100 %. Was stimmt?', opts: ['Die Lösung absorbiert dann eine andere Farbe.', 'Die absorbierte Farbe bleibt gleich, aber es wird mehr Licht absorbiert: die Lösung wird dunkler und der Farbton geht von Hellgelb über Gelb nach Orange.', 'Die Lösung wird heller, weil mehr Teilchen mehr Licht erzeugen.'], correct: 1, expl: 'Das Absorptionsspektrum liegt immer an derselben Stelle. Mit mehr Teilchen wird aber mehr Licht absorbiert, auch an den Rändern der Bande. Dadurch verändert sich die sichtbare Farbe (Lambert-Beer: mehr Teilchen, mehr Absorption).' }
      ,{ type: 'choice', q: 'Wie nennt man es, wenn Teilchen bestimmte Farben aus dem Licht aufnehmen („verschlucken“)?', opts: ['Reflexion', 'Absorption', 'Transmission', 'Adsorption'], correct: 1, expl: 'Absorption = Aufnahme von Licht. Transmission = Durchlassen, Reflexion = Zurückwerfen. Adsorption ist etwas anderes: Anlagerung von Teilchen an einer Oberfläche.' }
    ]
  });
})();

/* ================= Start ================= */
STATIONS.forEach(s => s.build(s.group));
camera.aspect = innerWidth / innerHeight; applyViewOffset(); camera.updateProjectionMatrix();
if (location.hash === '#debug') window.__sim = { STATIONS, showStation, refresh, S: () => cur, DONE, cam, goCam };
showStation(0, true);
requestAnimationFrame(animate);
